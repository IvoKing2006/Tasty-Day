function renderSchedule(editable){
  const section = el("div",{});
  const head = el("div",{class:"section-head"},[
    el("div",{},[
      el("h2",{class:"section-title"}, editable ? "Wochenplan erstellen" : "Wochenplan"),
      el("p",{class:"section-sub"}, editable ? "Feste Schichten zuweisen oder eine Extra-Schicht hinzufügen." : "Wer arbeitet wann — für alle sichtbar.")
    ]),
    renderWeekNav()
  ]);
  section.appendChild(head);

  if(editable){
    const toggleRow = el("div",{style:"margin-bottom:16px;display:flex;gap:8px;flex-wrap:wrap;"});
    const toggleBtn = el("button",{
      class:`tab ${state.showAvailInline?"active":""}`,
      onclick:()=>{ state.showAvailInline = !state.showAvailInline; render(); }
    }, state.showAvailInline ? icl("eyeOff","Verfügbarkeit ausblenden") : icl("eye","Verfügbarkeit einblenden"));
    toggleRow.appendChild(toggleBtn);
    const sendPlanBtn = renderSendPlanButton();
    if(sendPlanBtn) toggleRow.appendChild(sendPlanBtn);
    section.appendChild(toggleRow);
  }

  const dates = datesForWeek(state.weekOffset);
  const wid = weekIdFor(state.weekOffset);
  const allEmpIds = Object.keys(state.employees).filter(id=> state.employees[id].role !== "chef");
  const kitchenIds = allEmpIds.filter(id=> (state.employees[id].jobType||"kueche") !== "fahrer");
  const driverIds = allEmpIds.filter(id=> state.employees[id].jobType === "fahrer");

  // Fahrer sehen zuerst den Fahrer-Plan, alle anderen zuerst die Küche
  const me = state.employees[state.currentUser.id];
  const driverFirst = state.currentUser.role !== "chef" && me && me.jobType === "fahrer";
  const kitchenBlock = [icl("utensils","Küche"), kitchenIds, "kueche"];
  const driverBlock = [icl("truck","Fahrer"), driverIds, "fahrer"];
  const blocks = driverFirst ? [driverBlock, kitchenBlock] : [kitchenBlock, driverBlock];

  blocks.forEach(([title, ids, type], i)=>{
    section.appendChild(el("h3",{style:`margin:${i===0?26:30}px 0 12px;font-size:17px;color:var(--text);display:flex;align-items:center;gap:2px;`}, title));
    section.appendChild(buildScheduleBoard(editable, ids, dates, wid, type));
  });

  return section;
}

function buildScheduleBoard(editable, empIds, dates, wid, groupKey){
  const board = el("div",{class:"board"});

  DAYS.forEach((d,i)=>{
    const col = el("div",{class:"board-col"});
    col.appendChild(el("div",{class:"board-col-head"},[
      el("span",{}, d.label),
      el("span",{class:"d"}, fmtDate(dates[i]))
    ]));

    const extra = (state.weekData.extraShifts && state.weekData.extraShifts[d.key]) || {};
    const shifts = [
      ...defaultShiftsForDay(d.key),
      ...Object.entries(extra).map(([key,v])=>({key, label:v.label, defStart:"08:00", defEnd:"16:00", isExtra:true}))
    ];

    shifts.forEach(shift=>{
      const group = el("div",{class:"shift-group"});
      const labelRow = el("div",{style:"display:flex;align-items:center;justify-content:space-between;"},[
        el("div",{class:`shift-group-label ${shift.isExtra?"custom":""}`}, shift.label),
        (editable && shift.isExtra) ? el("button",{class:"shift-remove", style:"opacity:.8;font-size:14px;", onclick:()=>{
          if(confirm(`Schicht „${shift.label}“ wirklich entfernen? Alle Einteilungen dafür werden gelöscht.`)){
            remove(ref(db, `weeks/${wid}/extraShifts/${d.key}/${shift.key}`));
            remove(ref(db, `weeks/${wid}/schedule/${d.key}/${shift.key}`));
          }
        }},icl("x","entfernen")) : null
      ]);
      group.appendChild(labelRow);

      if(editable && state.showAvailInline && empIds.length > 0){
        const availableNames = empIds.filter(id=> isAvailableOn(id, d.key, shift.key)).map(id=> state.employees[id].name);
        const availRow = el("div",{style:"display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;"});
        if(availableNames.length === 0){
          availRow.appendChild(el("span",{style:"font-size:11.5px;color:var(--text-muted);font-style:italic;"}, "Niemand als „Kann“ eingetragen"));
        } else {
          availableNames.forEach(name=>{
            availRow.appendChild(el("span",{style:"font-size:11.5px;font-weight:700;background:var(--avocado-soft);color:var(--avocado);border:1px solid rgba(47,138,87,.3);border-radius:12px;padding:2px 8px;"}, icl("check", name)));
          });
        }
        group.appendChild(availRow);
      }
      const ticketsWrap = el("div",{class:"board-tickets"});
      const allAssignments = (state.weekData.schedule && state.weekData.schedule[d.key] && state.weekData.schedule[d.key][shift.key]) || {};
      const assignEntries = Object.entries(allAssignments).filter(([assignId, s])=> empIds.includes(s.employeeId));

      if(assignEntries.length === 0){
        ticketsWrap.appendChild(el("div",{class:"empty-slot"}, "Niemand eingeteilt"));
      } else {
        assignEntries.forEach(([assignId, s])=>{
          const empName = state.employees[s.employeeId] ? state.employees[s.employeeId].name : "?";
          const isMe = s.employeeId === state.currentUser.id;
          const ticket = el("div",{class:`ticket ${shift.isExtra?"custom-shift":""} ${isMe?"my-shift":""}`});
          const row = el("div",{class:"ticket-row"},[
            el("span",{class:"ticket-name"}, isMe ? `${empName} · Du` : empName),
            editable ? el("button",{class:"shift-remove", onclick:()=>{
              remove(ref(db, `weeks/${wid}/schedule/${d.key}/${shift.key}/${assignId}`));
            }},[ic("x")]) : null
          ]);
          ticket.appendChild(row);
          ticket.appendChild(el("div",{class:"ticket-dash"}));
          ticket.appendChild(el("div",{class:"ticket-time mono"}, `${s.start} – ${s.end}`));

          if(isMe && !editable && state.currentUser.role !== "chef"){
            const pendingReq = Object.entries(state.swapRequests || {}).find(([rid,r])=> r.from && r.from.assignId === assignId && (r.status === "pending" || r.status === "colleague"));
            if(pendingReq){
              const [reqId, pr] = pendingReq;
              const pendingWrap = el("div",{style:"margin-top:8px;"});
              const askedName = pr.to && state.employees[pr.to.employeeId] ? state.employees[pr.to.employeeId].name : "Kollege";
              pendingWrap.appendChild(el("div",{style:"font-size:12.5px;color:var(--mango);font-weight:700;margin-bottom:4px;"}, icl("hourglass", pr.status === "colleague" ? `Wartet auf ${askedName}` : "Wartet auf den Chef")));
              const cancelBtn = el("button",{style:"background:none;border:1px solid var(--line-strong);color:var(--text);border-radius:9px;background:var(--bg-elevated);padding:5px 10px;font-size:11.5px;font-weight:600;width:100%;"}, icl("x","Anfrage zurückziehen"));
              cancelBtn.addEventListener("click", ()=>{
                if(confirm("Diese Tauschanfrage wirklich zurückziehen?")){
                  remove(ref(db, `swapRequests/${reqId}`));
                }
              });
              pendingWrap.appendChild(cancelBtn);
              ticket.appendChild(pendingWrap);
            } else {
              const swapBtn = el("button",{style:"margin-top:8px;background:none;border:1px solid var(--line-strong);color:var(--text);border-radius:9px;background:var(--bg-elevated);padding:6px 10px;font-size:12.5px;font-weight:600;width:100%;"}, icl("swap","Tausch anfragen"));
              swapBtn.addEventListener("click", ()=> openSwapForm(ticket, wid, d.key, shift.key, assignId, s.employeeId, empIds));
              ticket.appendChild(swapBtn);
            }
          }

          if(editable){
            const dayDefaults = defaultShiftsForDay(d.key);
            const isDefaultShift = dayDefaults.some(ds=> ds.key === shift.key);
            const otherShift = dayDefaults.find(ds=> ds.key !== shift.key);
            if(isDefaultShift && otherShift){
              const otherAssignments = (state.weekData.schedule && state.weekData.schedule[d.key] && state.weekData.schedule[d.key][otherShift.key]) || {};
              const alreadyThere = Object.values(otherAssignments).some(a=> a.employeeId === s.employeeId);
              if(!alreadyThere){
                const copyBtn = el("button",{style:"margin-top:8px;background:none;border:1px dashed var(--avocado);color:var(--avocado);border-radius:7px;padding:6px 10px;font-size:12.5px;font-weight:600;width:100%;cursor:pointer;"}, `+ auch ${otherShift.label} (${s.start}–${s.end})`);
                copyBtn.addEventListener("click", async ()=>{
                  const newRef = push(ref(db, `weeks/${wid}/schedule/${d.key}/${otherShift.key}`));
                  await set(newRef, {employeeId: s.employeeId, start: s.start, end: s.end});
                });
                ticket.appendChild(copyBtn);
              }
            }
          }

          ticketsWrap.appendChild(ticket);
        });
      }
      group.appendChild(ticketsWrap);

      if(editable && empIds.length > 0){
        const assignedIds = new Set(Object.values(allAssignments).filter(a=> empIds.includes(a.employeeId)).map(a=> a.employeeId));
        const selectable = empIds.filter(id=> !assignedIds.has(id));
        if(selectable.length > 0){
          const addBtn = el("button",{class:"add-shift-btn"}, "+ Mitarbeiter");
          addBtn.addEventListener("click", ()=> openAssignForm(group, d.key, shift, selectable, wid));
          group.appendChild(addBtn);
        } else {
          group.appendChild(el("div",{style:"font-size:12.5px;color:var(--text-muted);text-align:center;padding:6px;"}, "Alle Mitarbeiter bereits eingeteilt"));
        }
      } else if(editable && empIds.length === 0){
        group.appendChild(el("div",{style:"font-size:12.5px;color:var(--text-muted);text-align:center;padding:6px;"}, groupKey==="fahrer" ? "Keine Fahrer registriert" : "Keine Küchen-Mitarbeiter registriert"));
      }
      col.appendChild(group);
    });

    if(editable){
      const extraBtn = el("button",{class:"add-extra-btn"}, "+ Extra-Schicht");
      extraBtn.addEventListener("click", ()=> openExtraShiftForm(col, d.key, wid));
      col.appendChild(extraBtn);
    }

    board.appendChild(col);
  });
  return board;
}

function openAssignForm(group, dayKey, shift, empIds, wid){
  const existing = group.querySelector(".assign-form");
  if(existing){ existing.remove(); return; }
  const form = el("div",{class:"assign-form"});

  const availableIds = empIds.filter(id=> isAvailableOn(id, dayKey, shift.key));
  const otherIds = empIds.filter(id=> !isAvailableOn(id, dayKey, shift.key));

  const empSelect = el("select",{});
  if(availableIds.length > 0){
    const grp1 = el("optgroup",{label:"Hat „Kann“ eingetragen"});
    availableIds.forEach(id=> grp1.appendChild(el("option",{value:id}, state.employees[id].name)));
    empSelect.appendChild(grp1);
  }
  if(otherIds.length > 0){
    const grp2 = el("optgroup",{label:"Einspringer (nicht eingetragen)"});
    otherIds.forEach(id=> grp2.appendChild(el("option",{value:id}, state.employees[id].name)));
    empSelect.appendChild(grp2);
  }

  if(availableIds.length === 0){
    form.appendChild(el("div",{style:"font-size:13px;color:var(--text-muted);background:var(--bg-elevated-2);padding:8px 10px;border-radius:7px;"}, "Niemand hat sich für diese Schicht als „Kann“ eingetragen — wähl unten einen Einspringer."));
  }

  const startInput = el("input",{type:"time"});
  const endInput = el("input",{type:"time"});

  form.appendChild(el("div",{class:"af-field"},[el("label",{},"Mitarbeiter"), empSelect]));
  form.appendChild(el("div",{class:"af-time-row"},[
    el("div",{class:"af-field"},[el("label",{},"Von"), startInput]),
    el("div",{class:"af-field"},[el("label",{},"Bis"), endInput]),
  ]));

  const actions = el("div",{class:"assign-form-actions"});
  const saveBtn = el("button",{class:"btn btn-primary"}, "Einteilen");
  const cancelBtn = el("button",{class:"btn-cancel"}, "Abbrechen");
  saveBtn.addEventListener("click", async ()=>{
    if(!startInput.value || !endInput.value){
      alert("Bitte Von- und Bis-Uhrzeit eintragen.");
      return;
    }
    const chosenId = empSelect.value;
    const availEntry = state.weekData.availability && state.weekData.availability[chosenId] && state.weekData.availability[chosenId][dayKey] && state.weekData.availability[chosenId][dayKey][shift.key];
    if(availEntry && availEntry.note){
      const proceed = confirm(`${state.employees[chosenId].name} hat für diese Schicht eine Notiz hinterlassen:\n\n„${availEntry.note}“\n\nTrotzdem einteilen?`);
      if(!proceed) return;
    }
    const newRef = push(ref(db, `weeks/${wid}/schedule/${dayKey}/${shift.key}`));
    await set(newRef, {employeeId: chosenId, start: startInput.value, end: endInput.value});
    form.remove();
  });
  cancelBtn.addEventListener("click", ()=> form.remove());
  actions.appendChild(saveBtn);
  actions.appendChild(cancelBtn);
  form.appendChild(actions);

  group.appendChild(form);
}

function openExtraShiftForm(col, dayKey, wid){
  const existing = col.querySelector(".extra-form");
  if(existing){ existing.remove(); return; }
  const form = el("div",{class:"extra-form", style:"margin-top:8px;display:flex;flex-direction:column;gap:6px;"});
  const labelInput = el("input",{type:"text", placeholder:"z. B. Früh", class:"select-emp"});
  const saveBtn = el("button",{class:"btn btn-primary", style:"padding:8px;font-size:13px;"}, "Schicht anlegen");
  saveBtn.addEventListener("click", async ()=>{
    if(!labelInput.value.trim()) return;
    const newRef = push(ref(db, `weeks/${wid}/extraShifts/${dayKey}`));
    await set(newRef, {label: labelInput.value.trim()});
    form.remove();
  });
  form.appendChild(labelInput);
  form.appendChild(saveBtn);
  col.appendChild(form);
}

// ---------- time entries ----------
function renderTimes(chefView){
  const section = el("div",{});
  section.appendChild(el("div",{class:"section-head"},[
    el("div",{},[
      el("h2",{class:"section-title"}, chefView ? "Arbeitszeiten — Team" : "Meine Arbeitszeiten"),

    ])
  ]));

  if(!chefView){
    const wage = employeeWage(state.currentUser.id);
    const isDriver = state.employees[state.currentUser.id] && state.employees[state.currentUser.id].jobType === "fahrer";

    const card = el("div",{class:"card"});

    addBtn.addEventListener("click", async ()=>{
      if(!dateInput.value || !startInput.value || !endInput.value) return;
      const hours = quarterHours(startInput.value, endInput.value);
      const tip = isDriver ? (parseFloat(tipInput.value) || 0) : 0;
      const newRef = push(ref(db, `timeEntries/${state.currentUser.id}`));
      const entry = {date: dateInput.value, start: startInput.value, end: endInput.value, hours, paid:false};
      if(isDriver) entry.tip = tip;
      await set(newRef, entry);
      tipInput.value = "";
    });

    const formFields = [
      el("div",{},[el("label",{style:"display:block;font-size:12.5px;color:var(--text-muted);margin-bottom:5px;"},"Datum"), dateInput]),

      el("div",{},[el("label",{style:"display:block;font-size:12.5px;color:var(--text-muted);margin-bottom:5px;"},"Bis"), endInput]),

    if(isDriver){
      formFields.push(el("div",{},[el("label",{style:"display:block;font-size:12.5px;color:var(--text-muted);margin-bottom:5px;"},"Trinkgeld (€)"), tipInput]));
    }
    formFields.push(addBtn);
    card.appendChild(el("div",{class:"time-form"}, formFields));

    const myEntries = Object.entries(state.timeEntries[state.currentUser.id] || {}).sort((a,b)=> b[1].date.localeCompare(a[1].date));
    card.appendChild(renderGroupedTimeList(myEntries, wage, (id)=> remove(ref(db, `timeEntries/${state.currentUser.id}/${id}`))));
    section.appendChild(card);

    const myPayouts = Object.entries(state.payouts[state.currentUser.id] || {}).sort((a,b)=> b[1].createdAt - a[1].createdAt);
    if(myPayouts.length > 0){
      const payoutCard = el("div",{class:"card"});
      payoutCard.appendChild(el("h3",{style:"margin:0 0 12px;font-size:15px;"}, "Auszahlungen"));

        const row = el("div",{class:"team-row", style:"flex-wrap:wrap;cursor:pointer;margin-bottom:0;"});

          el("div",{style:"font-weight:700;"}, fmtMoney(p.amount)),

        ]));
        const rightSide = el("div",{style:"display:flex;align-items:center;gap:8px;"});

          rightSide.appendChild(el("span",{class:"avail-pill yes"}, "Erhalt bestätigt"));
        } else {
          const confirmBtn = el("button",{class:"btn btn-primary", style:"width:auto;padding:8px 16px;font-size:13px;"}, "Erhalt bestätigen");
          confirmBtn.addEventListener("click", (ev)=>{
            ev.stopPropagation();
            update(ref(db, `payouts/${state.currentUser.id}/${payoutId}`), {status:"confirmed", confirmedAt: Date.now()});
          });
          rightSide.appendChild(confirmBtn);
        }
        row.appendChild(rightSide);

        const detailBox = el("div",{style:"display:none;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:6px;"});
        const includedEntries = Object.entries(state.timeEntries[state.currentUser.id] || {})
          .filter(([id,e])=> e.payoutId === payoutId)
          .sort((a,b)=> a[1].date.localeCompare(b[1].date));
        if(includedEntries.length === 0){
          detailBox.appendChild(el("div",{style:"font-size:13px;color:var(--text-muted);"}, "Keine Detail-Einträge gefunden."));
        } else {
          includedEntries.forEach(([id, entry])=>{
            const edt = new Date(entry.date);
            detailBox.appendChild(el("div",{style:"display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-bottom:1px solid var(--line);"},[
              el("span",{}, `${edt.toLocaleDateString("de-DE",{weekday:"short", day:"2-digit", month:"2-digit"})} · ${entry.start}–${entry.end}`),
              el("span",{class:"mono", style:"color:var(--mango);"}, `${fmtHours(entry.hours)} Std.`)
            ]));
          });
        }
        let open = false;
        row.addEventListener("click", ()=>{
          open = !open;
          detailBox.style.display = open ? "block" : "none";
        });
        wrap.appendChild(row);
        wrap.appendChild(detailBox);
        payoutCard.appendChild(wrap);
      });
      section.appendChild(payoutCard);
    }

    return section;
  }

  const empIds = Object.keys(state.employees).filter(id=> state.employees[id].role !== "chef");
  if(empIds.length === 0){
    section.appendChild(el("div",{class:"empty-state"},[el("div",{class:"big"},[ic("users")]),"Noch keine Mitarbeiter registriert."]));
    return section;
  }

  if(!state.chefTimesEmpId){
    const card = el("div",{class:"card"});
    empIds.forEach(id=>{
      const emp = state.employees[id];
      const entries = Object.values(state.timeEntries[id] || {});
      const totalHrs = entries.reduce((sum,e)=> sum + e.hours, 0);
      const row = el("div",{class:"team-row", style:"cursor:pointer;"});
      row.appendChild(el("span",{class:"name"}, emp.name));
      row.appendChild(el("div",{style:"display:flex;align-items:center;gap:10px;"},[
        el("span",{class:"mono", style:"font-size:13px;color:var(--text-muted);"}, `${fmtHours(totalHrs)} Std. gesamt`),
        el("span",{style:"color:var(--text-muted);font-size:16px;"}, "›")
      ]));
      row.addEventListener("click", ()=>{ state.chefTimesEmpId = id; render(); });
      card.appendChild(row);
    });
    section.appendChild(card);
    return section;
  }

  const emp = state.employees[state.chefTimesEmpId];
  if(!emp){ state.chefTimesEmpId = null; return renderTimes(true); }
  const empId = state.chefTimesEmpId;
  const backBtn = el("button",{class:"link-btn", style:"margin-bottom:14px;", onclick:()=>{ state.chefTimesEmpId=null; render(); }}, "‹ Zurück zur Übersicht");
  section.appendChild(backBtn);

  const wage = employeeWage(empId);

  // wage editor
  const wageCard = el("div",{class:"card"});
  wageCard.appendChild(el("h3",{style:"margin:0 0 12px;font-size:15px;"}, `${emp.name} — Stundenlohn`));
  const wageInput = el("input",{type:"number", step:"0.01", min:"0", placeholder:"z. B. 13.50", value: wage>0?wage:"", style:"width:140px;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:14px;"});
  const wageSaveBtn = el("button",{class:"btn btn-primary", style:"width:auto;padding:9px 18px;"}, "Speichern");
  wageSaveBtn.addEventListener("click", ()=>{
    const val = parseFloat(wageInput.value);
    update(ref(db, `employees/${empId}`), {hourlyWage: isNaN(val) ? 0 : val});
  });
  wageCard.appendChild(el("div",{style:"display:flex;align-items:center;gap:10px;flex-wrap:wrap;"},[
    wageInput, el("span",{style:"color:var(--text-muted);font-size:14px;"},"€ / Stunde"), wageSaveBtn
  ]));
  section.appendChild(wageCard);

  // unpaid entries with selectable checkboxes
  const allEntries = Object.entries(state.timeEntries[empId] || {}).sort((a,b)=> b[1].date.localeCompare(a[1].date));
  const unpaidEntries = allEntries.filter(([id,e])=> !e.paid);
  const selected = new Set(unpaidEntries.map(([id])=> id)); // alle standardmäßig ausgewählt

  const payoutCard = el("div",{class:"card"});
  payoutCard.appendChild(el("h3",{style:"margin:0 0 12px;font-size:15px;"}, "Offene Auszahlung"));

  if(unpaidEntries.length === 0){
    payoutCard.appendChild(el("div",{style:"font-size:13px;color:var(--text-muted);"}, "Keine offenen, unbezahlten Stunden."));
  } else {
    const summaryBox = el("div",{style:"display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;background:var(--bg-elevated-2);border-radius:10px;padding:14px 16px;margin-bottom:12px;"});
    const summaryText = el("div",{});
    const payBtn = el("button",{class:"btn btn-primary", style:"width:auto;padding:10px 18px;"}, "Ausgewählte auszahlen");
    summaryBox.appendChild(summaryText);
    summaryBox.appendChild(payBtn);
    payoutCard.appendChild(summaryBox);

    const checkList = el("div",{style:"display:flex;flex-direction:column;gap:6px;margin-bottom:10px;"});
    unpaidEntries.forEach(([id, entry])=>{
      const dt = new Date(entry.date);
      const row = el("label",{style:"display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:14px;cursor:pointer;"});
      const checkbox = el("input",{type:"checkbox", checked:"checked", style:"width:16px;height:16px;accent-color:var(--mango);cursor:pointer;"});
      checkbox.addEventListener("change", ()=>{
        if(checkbox.checked) selected.add(id); else selected.delete(id);
        updateSummary();
      });
      row.appendChild(checkbox);
      row.appendChild(el("span",{style:"flex:1;"}, `${dt.toLocaleDateString("de-DE",{weekday:"short", day:"2-digit", month:"2-digit"})} · ${entry.start}–${entry.end}`));
      if(entry.tip) row.appendChild(el("span",{class:"mono", style:"font-size:12.5px;color:var(--mango);"}, icl("coins", fmtMoney(entry.tip))));
      row.appendChild(el("span",{class:"hrs mono"}, `${fmtHours(entry.hours)} Std.`));
      checkList.appendChild(row);
    });
    payoutCard.appendChild(checkList);

    const selectRow = el("div",{style:"display:flex;gap:14px;margin-bottom:12px;"});
    const selAllBtn = el("button",{class:"link-btn"}, "Alle auswählen");
    const selNoneBtn = el("button",{class:"link-btn"}, "Keine auswählen");
    selAllBtn.addEventListener("click", ()=>{
      unpaidEntries.forEach(([id])=> selected.add(id));
      checkList.querySelectorAll('input[type="checkbox"]').forEach(cb=> cb.checked = true);
      updateSummary();
    });
    selNoneBtn.addEventListener("click", ()=>{
      selected.clear();
      checkList.querySelectorAll('input[type="checkbox"]').forEach(cb=> cb.checked = false);
      updateSummary();
    });
    selectRow.appendChild(selAllBtn);
    selectRow.appendChild(selNoneBtn);
    payoutCard.appendChild(selectRow);

    function updateSummary(){
      const chosen = unpaidEntries.filter(([id])=> selected.has(id));
      const hoursSum = chosen.reduce((s,[id,e])=> s+e.hours, 0);
      const tipSum = chosen.reduce((s,[id,e])=> s+(e.tip||0), 0);
      const amountSum = hoursSum * wage + tipSum;
      summaryText.innerHTML = "";
      const detailParts = [`${chosen.length} Schicht(en) ausgewählt`, `${fmtHours(hoursSum)} Std.`];
      if(tipSum > 0) detailParts.push(`+ ${fmtMoney(tipSum)} Trinkgeld`);
      summaryText.appendChild(el("div",{class:"mono", style:"font-size:14px;color:var(--text-muted);"}, detailParts.join(" · ")));
      summaryText.appendChild(el("div",{style:"font-size:20px;font-weight:700;color:var(--mango);margin-top:2px;"}, (wage>0 || tipSum>0) ? fmtMoney(amountSum) : "Stundenlohn fehlt"));
      payBtn.disabled = chosen.length === 0 || (wage <= 0 && tipSum <= 0);
      payBtn.style.opacity = payBtn.disabled ? ".5" : "1";
    }
    updateSummary();

    payBtn.addEventListener("click", ()=>{
      const chosen = unpaidEntries.filter(([id])=> selected.has(id));
      if(chosen.length === 0) return;
      const hoursSum = chosen.reduce((s,[id,e])=> s+e.hours, 0);
      const tipSum = chosen.reduce((s,[id,e])=> s+(e.tip||0), 0);
      const amountSum = hoursSum * wage + tipSum;
      if(!confirm(`${fmtMoney(amountSum)} (${chosen.length} Schicht(en)) für ${emp.name} als ausgezahlt markieren?`)) return;
      const payoutRef = push(ref(db, `payouts/${empId}`));
      const payoutId = payoutRef.key;
      const updates = {};
      chosen.forEach(([id])=>{
        updates[`timeEntries/${empId}/${id}/paid`] = true;
        updates[`timeEntries/${empId}/${id}/payoutId`] = payoutId;
      });
      updates[`payouts/${empId}/${payoutId}`] = {amount: amountSum, hours: hoursSum, tip: tipSum, createdAt: Date.now(), status:"pending"};
      update(ref(db), updates);
    });
  }
  section.appendChild(payoutCard);

  // payout history
  const payoutEntries = Object.entries(state.payouts[empId] || {}).sort((a,b)=> b[1].createdAt - a[1].createdAt);
  if(payoutEntries.length > 0){
    const historyCard = el("div",{class:"card"});
    historyCard.appendChild(el("h3",{style:"margin:0 0 12px;font-size:15px;"}, "Auszahlungs-Historie"));
    payoutEntries.forEach(([payoutId, p])=>{
      const dt = new Date(p.createdAt);
      const wrap = el("div",{style:"margin-bottom:8px;"});
      const row = el("div",{class:"team-row", style:"flex-wrap:wrap;cursor:pointer;margin-bottom:0;"});
      row.appendChild(el("div",{},[
        el("div",{style:"font-weight:700;"}, fmtMoney(p.amount)),
        el("div",{style:"font-size:12.5px;color:var(--text-muted);"}, `${fmtHours(p.hours)} Std.${p.tip ? ` · davon ${fmtMoney(p.tip)} Trinkgeld` : ""} · markiert am ${dt.toLocaleDateString("de-DE")} · Tage anzeigen ▾`)
      ]));
      row.appendChild(el("span",{class:`avail-pill ${p.status==="confirmed"?"yes":"no"}`}, p.status==="confirmed" ? "Vom Mitarbeiter bestätigt" : "Bestätigung ausstehend"));

      const detailBox = el("div",{style:"display:none;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:6px;"});
      const includedEntries = Object.entries(state.timeEntries[empId] || {})
        .filter(([id,e])=> e.payoutId === payoutId)
        .sort((a,b)=> a[1].date.localeCompare(b[1].date));
      if(includedEntries.length === 0){
        detailBox.appendChild(el("div",{style:"font-size:13px;color:var(--text-muted);"}, "Keine Detail-Einträge gefunden."));
      } else {
        includedEntries.forEach(([id, entry])=>{
          const edt = new Date(entry.date);
          detailBox.appendChild(el("div",{style:"display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-bottom:1px solid var(--line);"},[
            el("span",{}, `${edt.toLocaleDateString("de-DE",{weekday:"short", day:"2-digit", month:"2-digit"})} · ${entry.start}–${entry.end}`),
            el("span",{class:"mono", style:"color:var(--mango);"}, `${fmtHours(entry.hours)} Std.`)
          ]));
        });
      }
      let open = false;
      row.addEventListener("click", ()=>{
        open = !open;
        detailBox.style.display = open ? "block" : "none";
      });
      wrap.appendChild(row);
      wrap.appendChild(detailBox);
      historyCard.appendChild(wrap);
    });
    section.appendChild(historyCard);
  }

  // full entry list
  const card = el("div",{class:"card"});
  card.appendChild(el("h3",{style:"margin:0 0 12px;font-size:15px;"}, "Alle Einträge"));
  card.appendChild(renderGroupedTimeList(allEntries, wage, null));
  section.appendChild(card);
  return section;
}

// ---------- team management (chef only) ----------
function todayDayKey(){
  const day = new Date().getDay();
  return DAYS[(day+6)%7].key;
}

function renderDashboard(){
  const section = el("div",{});
  section.appendChild(el("div",{class:"section-head"},[
    el("div",{},[
      el("h2",{class:"section-title"}, `Übersicht`),
      el("p",{class:"section-sub"}, new Date().toLocaleDateString("de-DE",{weekday:"long", day:"2-digit", month:"long", year:"numeric"}))
    ])
  ]));

  const pendingSwaps = Object.values(state.swapRequests||{}).filter(r=> r.status==="pending").length;
  const activeInv = Object.entries(state.inventory||{}).filter(([id,it])=> !it.archived);
  const criticalInv = activeInv.filter(([id,it])=> itemStatus(it)==="red");
  const expiringSoonInv = activeInv.filter(([id,it])=>{
    const exp = earliestBatchExpiry(it);
    return exp && daysUntil(exp) <= EXPIRY_WARN_DAYS;
  });

  const todayKey = todayDayKey();
  const todaySchedule = (state.currentWeekData.schedule && state.currentWeekData.schedule[todayKey]) || {};
  const todayAssignments = [];
  Object.entries(todaySchedule).forEach(([shiftKey, assigns])=>{
    Object.values(assigns).forEach(a=> todayAssignments.push({...a, shiftKey}));
  });

  const pc = computePersonnelCostMaps();
  const revMaps = buildAmountMaps(state.revenue);
  const expMaps = buildAmountMaps(state.expenses);
  const thisWeekKey = weekIdFor(0);
  const weekRev = revMaps.weeklyMap[thisWeekKey] || 0;
  const weekExp = expMaps.weeklyMap[thisWeekKey] || 0;
  const weekCost = (pc.weeklyMap[thisWeekKey] && pc.weeklyMap[thisWeekKey].cost) || 0;
  const weekProfit = weekRev - weekExp - weekCost;

  const grid = el("div",{class:"dash-grid"});

  const tile1 = el("div",{class:`dash-tile ${pendingSwaps>0?"warn":""}`, onclick:()=>{ state.tab="swaps"; render(); }});
  tile1.appendChild(el("span",{class:"dash-icon"},[ic("swap")]));
  tile1.appendChild(el("div",{class:"dash-value"}, String(pendingSwaps)));
  tile1.appendChild(el("div",{class:"dash-label"}, "Offene Tauschanfragen"));
  grid.appendChild(tile1);

  const tile2 = el("div",{class:`dash-tile ${criticalInv.length>0?"warn":"good"}`, onclick:()=>{ state.tab="inventory"; render(); }});
  tile2.appendChild(el("span",{class:"dash-icon"},[ic("package")]));
  tile2.appendChild(el("div",{class:"dash-value"}, String(criticalInv.length)));
  tile2.appendChild(el("div",{class:"dash-label"}, "Kritische Zutaten"));
  grid.appendChild(tile2);

  const tile2b = el("div",{class:`dash-tile ${expiringSoonInv.length>0?"warn":"good"}`, onclick:()=>{ state.tab="inventory"; render(); }});
  tile2b.appendChild(el("span",{class:"dash-icon"},[ic("clock")]));
  tile2b.appendChild(el("div",{class:"dash-value"}, String(expiringSoonInv.length)));
  tile2b.appendChild(el("div",{class:"dash-label"}, `Läuft in ${EXPIRY_WARN_DAYS} Tagen ab`));
  grid.appendChild(tile2b);

  const tile3 = el("div",{class:`dash-tile ${weekProfit>=0?"good":"warn"}`, onclick:()=>{ state.tab="finance"; render(); }});
  tile3.appendChild(el("span",{class:"dash-icon"},[ic("euro")]));
  tile3.appendChild(el("div",{class:"dash-value"}, fmtMoney(weekProfit)));
  tile3.appendChild(el("div",{class:"dash-label"}, "Gewinn diese Woche"));
  grid.appendChild(tile3);

  const tile4 = el("div",{class:"dash-tile", onclick:()=>{ state.tab="plan"; render(); }});
  tile4.appendChild(el("span",{class:"dash-icon"},[ic("users")]));
  tile4.appendChild(el("div",{class:"dash-value"}, String(todayAssignments.length)));
  tile4.appendChild(el("div",{class:"dash-label"}, "Im Einsatz heute"));
  grid.appendChild(tile4);

  section.appendChild(grid);

  // today's shifts
  const todayCard = el("div",{class:"card"});
  todayCard.appendChild(el("h3",{style:"margin:0 0 12px;font-size:15px;"}, `Heute im Einsatz — ${(DAYS.find(d=>d.key===todayKey)||{}).label||""}`));
  if(todayAssignments.length === 0){
    todayCard.appendChild(el("div",{style:"font-size:13px;color:var(--text-muted);"}, "Niemand eingeteilt."));
  } else {
    todayAssignments.sort((a,b)=> (a.start||"").localeCompare(b.start||"")).forEach(a=>{
      const emp = state.employees[a.employeeId];
      const empName = emp ? emp.name : "?";
      const jobIcon = emp && emp.jobType==="fahrer" ? "truck" : "utensils";
      todayCard.appendChild(el("div",{class:"team-row"},[
        el("span",{class:"name"}, icl(jobIcon, empName)),
        el("span",{class:"mono", style:"font-size:13px;color:var(--text-muted);"}, `${a.start}–${a.end}`)
      ]));
    });
  }
  section.appendChild(todayCard);

  // critical inventory list
  if(criticalInv.length > 0){
    const critCard = el("div",{class:"card"});
    critCard.appendChild(el("h3",{style:"margin:0 0 12px;font-size:15px;color:var(--chili);"}, icl("cart","Kritische Zutaten")));
    criticalInv.forEach(([id, it])=>{
      const missing = Math.max(0, (it.soll||0)-(it.ist||0));
      critCard.appendChild(el("div",{class:"stock-row"},[
        el("span",{class:"stock-dot red"}),
        el("span",{class:"stock-name"}, it.name),
        el("span",{class:"mono", style:"font-size:12.5px;color:var(--chili);"}, `${fmtNum(missing)} ${it.unit||""} fehlen`)
      ]));
    });
    const jumpBtn = el("button",{class:"link-btn", style:"margin-top:6px;"}, "Zum Lagerbestand");
    jumpBtn.addEventListener("click", ()=>{ state.tab="inventory"; render(); });
    critCard.appendChild(jumpBtn);
    section.appendChild(critCard);
  }

  return section;
}

function recipeCost(recipe){
  let cost = 0, missing = false;
  const ingredients = recipe.ingredients || {};
  const hasIngredients = Object.keys(ingredients).length > 0;
  Object.entries(ingredients).forEach(([invId, qty])=>{
    const item = state.inventory[invId];
    if(!item || !item.price){ missing = true; return; }
    cost += item.price * qty;
  });
  return {cost, missing, hasIngredients};
}

function collectOtherAssignments(excludeAssignId, excludeEmployeeId, empIds){
  const result = [];
  const scheduleObj = state.weekData.schedule || {};
  Object.keys(scheduleObj).forEach(dayKey=>{
    Object.keys(scheduleObj[dayKey] || {}).forEach(shiftKey=>{
      Object.entries(scheduleObj[dayKey][shiftKey] || {}).forEach(([assignId, s])=>{
        if(assignId === excludeAssignId) return;
        if(s.employeeId === excludeEmployeeId) return;
        if(empIds && !empIds.includes(s.employeeId)) return;
        result.push({dayKey, shiftKey, assignId, employeeId: s.employeeId, start:s.start, end:s.end});
      });
    });
  });
  const dayOrder = DAYS.map(d=> d.key);
  result.sort((a,b)=> dayOrder.indexOf(a.dayKey) - dayOrder.indexOf(b.dayKey));
  return result;
}

function openSwapForm(ticket, wid, dayKey, shiftKey, assignId, fromEmployeeId, empIds){
  const existing = ticket.querySelector(".swap-form");
  if(existing){ existing.remove(); return; }
  const form = el("div",{class:"swap-form", style:"margin-top:8px;display:flex;flex-direction:column;gap:8px;"});
  const dayLabel = (key)=> (DAYS.find(d=> d.key===key) || {}).label || key;

  const modeSelect = el("select",{style:"width:100%;padding:8px 10px;border-radius:7px;border:1px solid var(--line);background:var(--paper-dim);color:var(--ink);font-size:13px;"},[
    el("option",{value:"swap"}, "Echter Tausch — mit einer anderen Schicht tauschen"),
    el("option",{value:"giveaway"}, "Komplett abgeben — ich arbeite dann gar nicht"),
  ]);

  const targetWrap = el("div",{});
  form.appendChild(modeSelect);
  form.appendChild(targetWrap);

  function buildSwapTargetSelect(){
    targetWrap.innerHTML = "";
    const others = collectOtherAssignments(assignId, fromEmployeeId, empIds);
    if(others.length === 0){
      targetWrap.appendChild(el("div",{style:"font-size:12.5px;color:var(--ink);opacity:.7;"}, "Keine anderen Schichten in dieser Woche zum Tauschen vorhanden."));
      return null;
    }
    const sel = el("select",{style:"width:100%;padding:8px 10px;border-radius:7px;border:1px solid var(--line);background:var(--paper-dim);color:var(--ink);font-size:13px;"});
    others.forEach((o,i)=>{
      const name = state.employees[o.employeeId] ? state.employees[o.employeeId].name : "?";
      sel.appendChild(el("option",{value:String(i)}, `${name} — ${dayLabel(o.dayKey)} (${o.shiftKey}) ${o.start}–${o.end}`));
    });
    targetWrap.appendChild(sel);
    return {sel, others};
  }

  function buildGiveawaySelect(){
    targetWrap.innerHTML = "";
    const candidates = empIds.filter(id=> id !== fromEmployeeId);
    if(candidates.length === 0){
      targetWrap.appendChild(el("div",{style:"font-size:12.5px;color:var(--ink);opacity:.7;"}, "Kein anderer Mitarbeiter verfügbar."));
      return null;
    }
    const sel = el("select",{style:"width:100%;padding:8px 10px;border-radius:7px;border:1px solid var(--line);background:var(--paper-dim);color:var(--ink);font-size:13px;"});
    candidates.forEach(id=> sel.appendChild(el("option",{value:id}, state.employees[id].name)));
    targetWrap.appendChild(sel);
    return {sel};
  }

  let current = buildSwapTargetSelect();
  modeSelect.addEventListener("change", ()=>{
    current = modeSelect.value === "swap" ? buildSwapTargetSelect() : buildGiveawaySelect();
  });

  const sendBtn = el("button",{class:"btn btn-primary", style:"padding:8px;font-size:13px;"}, "Anfrage senden");
  sendBtn.addEventListener("click", async ()=>{
    if(!current) return;
    const mode = modeSelect.value;
    const record = {
      weekId: wid,
      mode,
      from: {employeeId: fromEmployeeId, dayKey, shiftKey, assignId},
      status:"colleague", createdAt: Date.now()
    };
    if(mode === "swap"){
      const chosen = current.others[parseInt(current.sel.value,10)];
      record.to = {employeeId: chosen.employeeId, dayKey: chosen.dayKey, shiftKey: chosen.shiftKey, assignId: chosen.assignId};
    } else {
      record.to = {employeeId: current.sel.value};
    }
    const newRef = push(ref(db, "swapRequests"));
    await set(newRef, record);
    notifyWorker({type:"swapRequest", id: newRef.key});
    form.remove();
  });
  form.appendChild(sendBtn);
  ticket.appendChild(form);
}

// ---------- personnel costs (chef) ----------
function computePersonnelCostMaps(){
  const empIds = Object.keys(state.employees).filter(id=> state.employees[id].role !== "chef");
  const dailyMap = {}, weeklyMap = {}, monthlyMap = {}, yearlyMap = {};
  empIds.forEach(id=>{
    const wage = employeeWage(id);
    Object.values(state.timeEntries[id] || {}).forEach(entry=>{
      const cost = entry.hours * wage;
      if(!dailyMap[entry.date]) dailyMap[entry.date] = {hours:0, cost:0};
      dailyMap[entry.date].hours += entry.hours;
      dailyMap[entry.date].cost += cost;

      const wk = isoWeekKeyFromDate(entry.date);
      if(!weeklyMap[wk]) weeklyMap[wk] = {hours:0, cost:0};
      weeklyMap[wk].hours += entry.hours;
      weeklyMap[wk].cost += cost;

      const mk = entry.date.slice(0,7);
      if(!monthlyMap[mk]) monthlyMap[mk] = {hours:0, cost:0};
      monthlyMap[mk].hours += entry.hours;
      monthlyMap[mk].cost += cost;

      const yk = entry.date.slice(0,4);
      if(!yearlyMap[yk]) yearlyMap[yk] = {hours:0, cost:0};
      yearlyMap[yk].hours += entry.hours;
      yearlyMap[yk].cost += cost;
    });
  });
  return {dailyMap, weeklyMap, monthlyMap, yearlyMap};
}

// ---------- Finanzen (Umsatz, Ausgaben, Gewinn) ----------
function buildAmountMaps(source){
  const dailyMap = {}, weeklyMap = {}, monthlyMap = {}, yearlyMap = {};
  Object.values(source || {}).forEach(entry=>{
    const amt = entry.amount || 0;
    if(!dailyMap[entry.date]) dailyMap[entry.date] = 0;
    dailyMap[entry.date] += amt;
    const wk = isoWeekKeyFromDate(entry.date);
    if(!weeklyMap[wk]) weeklyMap[wk] = 0;
    weeklyMap[wk] += amt;
    const mk = entry.date.slice(0,7);
    if(!monthlyMap[mk]) monthlyMap[mk] = 0;
    monthlyMap[mk] += amt;
    const yk = entry.date.slice(0,4);
    if(!yearlyMap[yk]) yearlyMap[yk] = 0;
    yearlyMap[yk] += amt;
  });
  return {dailyMap, weeklyMap, monthlyMap, yearlyMap};
}

function periodKeysForView(view, endOffset, count){
  const keys = [];
  for(let i=count-1;i>=0;i--){
    const offset = endOffset - i;
    if(view==="day"){
      const d = new Date(); d.setDate(d.getDate()+offset);
      keys.push({key: toDateKey(d), label: d.toLocaleDateString("de-DE",{weekday:"short"})});
    } else if(view==="week"){
      const wk = weekIdFor(offset);
      keys.push({key: wk, label: "KW"+wk.split("-W")[1]});
    } else if(view==="month"){
      const d = new Date(); d.setMonth(d.getMonth()+offset,1);
      keys.push({key: toMonthKey(d), label: d.toLocaleDateString("de-DE",{month:"short"})});
    } else {
      const y = new Date().getFullYear()+offset;
      keys.push({key:String(y), label:String(y)});
    }
  }
  return keys;
}

function renderFinance(){
  const section = el("div",{});
  section.appendChild(el("div",{class:"section-head"},[
    el("div",{},[
      el("h2",{class:"section-title"}, "Finanzen"),
      el("p",{class:"section-sub"}, "Umsatz, Ausgaben und Personalkosten im Überblick.")
    ])
  ]));

  const revMaps = buildAmountMaps(state.revenue);
  const expMaps = buildAmountMaps(state.expenses);
  const pc = computePersonnelCostMaps();
  const mapsByView = {
    day: {rev: revMaps.dailyMap, exp: expMaps.dailyMap, cost: pc.dailyMap},
    week: {rev: revMaps.weeklyMap, exp: expMaps.weeklyMap, cost: pc.weeklyMap},
    month: {rev: revMaps.monthlyMap, exp: expMaps.monthlyMap, cost: pc.monthlyMap},
    year: {rev: revMaps.yearlyMap, exp: expMaps.yearlyMap, cost: pc.yearlyMap},
  }[state.financeView];

  const offsetKey = state.financeView+"Offset";
  const currentOffset = {day: state.financeDayOffset, week: state.financeWeekOffset, month: state.financeMonthOffset, year: state.financeYearOffset}[state.financeView];

  function profitAt(offset){
    const k = periodKeysForView(state.financeView, offset, 1)[0].key;
    const rev = mapsByView.rev[k] || 0;
    const exp = mapsByView.exp[k] || 0;
    const cost = (mapsByView.cost[k] && mapsByView.cost[k].cost) || 0;

  // period toggle
  const toggleRow = el("div",{style:"display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;"});
  [{key:"day",label:"Tag"},{key:"week",label:"Woche"},{key:"month",label:"Monat"},{key:"year",label:"Jahr"}].forEach(v=>{

  section.appendChild(toggleRow);

  // period navigation label
  let periodLabel;
  if(state.financeView==="day"){
    const d = new Date(); d.setDate(d.getDate()+currentOffset);

function stockStatus(ist, soll){
  if(!soll || soll <= 0) return "green";
  const pct = ist / soll;
  if(pct <= 0.25) return "red";
  if(pct <= 0.5) return "yellow";
  return "green";
}
function itemStatus(it){
  return stockStatus(it.ist||0, it.soll||0);
}
function calcNettoBrutto(value, type, vatRate){
  if(type === "netto"){
    return {netto: value, brutto: Math.round(value*(1+vatRate/100)*100)/100};
  } else {
    return {netto: Math.round(value/(1+vatRate/100)*100)/100, brutto: value};
  }
}

const INV_CODE_PREFIX = "TDINV:";
const EXPIRY_WARN_DAYS = 3;

function logInventoryConsumption(id, prevVal, newVal){
  const consumed = prevVal - newVal;
  if(consumed > 0){
    set(push(ref(db, `inventoryLog/${id}`)), {date: toDateKey(new Date()), amount: consumed});
  }
}

async function bumpIst(id, qty){
  const item = state.inventory[id];
  if(!item) return;
  await update(ref(db, `inventory/${id}`), {ist:(item.ist||0)+qty});
}

async function addInventoryBatch(id, qty, expiryOrNull){
  const item = state.inventory[id];
  if(!item || qty <= 0) return;
  const batchRef = push(ref(db, `inventory/${id}/batches`));
  const updates = {};
  updates[`inventory/${id}/batches/${batchRef.key}`] = {qty, expiry: expiryOrNull || null, addedAt: Date.now()};
  updates[`inventory/${id}/ist`] = (item.ist||0) + qty;
  await update(ref(db), updates);
}

async function consumeInventoryBatches(id, qty){
  const item = state.inventory[id];
  if(!item) return;
  const prevIst = item.ist||0;
  const batches = Object.entries(item.batches || {}).sort((a,b)=>{
    const ea = a[1].expiry || "9999-99-99";
    const eb = b[1].expiry || "9999-99-99";
    return ea.localeCompare(eb);
  });
  let remaining = qty;
  const updates = {};
  for(const [bid, b] of batches){
    if(remaining <= 0) break;
    const take = Math.min(b.qty, remaining);
    remaining -= take;
    const newQty = b.qty - take;
    if(newQty <= 0){
      updates[`inventory/${id}/batches/${bid}`] = null;
    } else {
      updates[`inventory/${id}/batches/${bid}/qty`] = newQty;
    }
  }
  // Ist-Menge sinkt immer um die volle angeforderte Menge, unabhängig davon,
  // ob genug erfasste Chargen dafür vorhanden sind (nicht jede Ware hat ein MHD erfasst).
  const newIst = Math.max(0, prevIst - qty);
  updates[`inventory/${id}/ist`] = newIst;
  await update(ref(db), updates);
  logInventoryConsumption(id, prevIst, newIst);
}

function earliestBatchExpiry(item){
  const batches = Object.values(item.batches || {}).filter(b=> b.expiry && b.qty > 0);
  if(batches.length === 0) return null;
  return batches.reduce((min,b)=> !min || b.expiry < min ? b.expiry : min, null);
}

function daysUntil(dateStr){
  const target = localDateFromKey(dateStr);
  const today = localDateFromKey(toDateKey(new Date()));
  return Math.round((target - today) / 86400000);
}
