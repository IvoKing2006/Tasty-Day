<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Tasty Day — Dienstplan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1E2019;
    --bg-elevated:#262920;
    --bg-elevated-2:#2E3226;
    --paper:#F1EEE4;
    --paper-dim:#E4E0D2;
    --ink:#2B2620;
    --text:#F1EEE4;
    --text-muted:#9A9686;
    --line:#3A3D31;
    --mango:#E8A23D;
    --mango-ink:#3A2A0F;
    --avocado:#7C9A5D;
    --avocado-ink:#1E2A16;
    --chili:#D1543A;
    --chili-ink:#3A160F;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Space Grotesk',sans-serif;
    letter-spacing:-0.01em;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  a{color:inherit;}

  #app{min-height:100vh;display:flex;flex-direction:column;}
  .center-screen{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:24px;
  }
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 20px;border-bottom:1px solid var(--line);
    position:sticky;top:0;background:var(--bg);z-index:20;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .mark{
    width:34px;height:34px;border-radius:9px;
    background:linear-gradient(135deg,var(--mango),var(--chili));
    display:flex;align-items:center;justify-content:center;
    font-family:'Space Grotesk';font-weight:700;color:var(--mango-ink);font-size:16px;
  }
  .brand-name{font-family:'Space Grotesk';font-weight:600;font-size:16px;}
  .brand-sub{font-size:11px;color:var(--text-muted);margin-top:-2px;}
  .user-chip{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-muted);}
  .logout-btn{
    background:none;border:1px solid var(--line);color:var(--text-muted);
    padding:6px 12px;border-radius:20px;font-size:12px;
  }
  .logout-btn:hover{border-color:var(--chili);color:var(--chili);}

  .tabs{
    display:flex;gap:4px;padding:10px 20px;border-bottom:1px solid var(--line);
    overflow-x:auto;position:sticky;top:65px;background:var(--bg);z-index:19;
  }
  .tab{
    background:none;border:none;color:var(--text-muted);
    padding:8px 14px;border-radius:20px;font-size:13px;font-weight:600;
    white-space:nowrap;transition:.15s;
  }
  .tab.active{background:var(--bg-elevated-2);color:var(--mango);}
  .tab:hover:not(.active){color:var(--text);}

  main{flex:1;padding:20px;max-width:1400px;margin:0 auto;width:100%;}

  .ticket{
    background:var(--bg-elevated-2);color:var(--text);
    border-radius:10px;position:relative;
    padding:14px 16px;
    border-left:5px solid var(--avocado);
    border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line);
  }
  .ticket.custom-shift{border-left-color:var(--mango);}
  .ticket.my-shift{
    background:rgba(232,162,61,.14);
    border-left-color:var(--mango);
    box-shadow:0 0 0 1px var(--mango);
  }
  .ticket.my-shift .ticket-name{color:var(--mango);}
  .ticket-row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .ticket-name{font-weight:700;font-size:16px;line-height:1.35;overflow-wrap:anywhere;color:var(--text);}
  .ticket-time{font-family:'IBM Plex Mono';font-size:14px;color:var(--mango);margin-top:6px;font-weight:500;}
  .ticket-dash{display:none;}

  .auth-card{
    width:100%;max-width:380px;background:var(--bg-elevated);
    border:1px solid var(--line);border-radius:var(--radius);padding:28px;
  }
  .auth-title{font-size:22px;font-weight:700;margin:0 0 4px;}
  .auth-sub{color:var(--text-muted);font-size:13px;margin:0 0 22px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--text-muted);margin-bottom:6px;font-weight:600;}
  .field input, .field select{
    width:100%;padding:11px 13px;border-radius:9px;
    border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:14px;
  }
  .field input:focus, .field select:focus{outline:none;border-color:var(--mango);}
  .btn{width:100%;padding:12px;border-radius:9px;border:none;font-weight:700;font-size:14px;transition:.15s;}
  .btn-primary{background:var(--mango);color:var(--mango-ink);}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-ghost{background:none;border:1px solid var(--line);color:var(--text);}
  .btn-ghost:hover{border-color:var(--text-muted);}
  .btn-danger{background:none;border:1px solid var(--chili);color:var(--chili);}
  .btn-danger:hover{background:var(--chili);color:#fff;}
  .auth-switch{text-align:center;margin-top:16px;font-size:13px;color:var(--text-muted);}
  .auth-switch button{background:none;border:none;color:var(--mango);font-weight:600;font-size:13px;padding:0;}
  .error-msg{
    background:rgba(209,84,58,.15);border:1px solid var(--chili);color:#F4B8A8;
    padding:9px 12px;border-radius:8px;font-size:13px;margin-bottom:14px;
  }
  .info-msg{
    background:rgba(124,154,93,.15);border:1px solid var(--avocado);color:#C9DAB6;
    padding:9px 12px;border-radius:8px;font-size:13px;margin-bottom:14px;
  }
  .code-display{
    font-family:'IBM Plex Mono';font-size:32px;font-weight:600;letter-spacing:.15em;
    text-align:center;color:var(--mango);background:var(--bg);border:1px dashed var(--line);
    border-radius:10px;padding:16px;margin-bottom:16px;
  }

  .section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
  .section-title{font-size:19px;font-weight:700;margin:0;}
  .section-sub{color:var(--text-muted);font-size:13px;margin:2px 0 0;}
  .week-nav{display:flex;align-items:center;gap:10px;}
  .week-nav button{
    background:var(--bg-elevated-2);border:1px solid var(--line);color:var(--text);
    width:32px;height:32px;border-radius:8px;font-size:15px;
  }
  .week-nav button:hover{border-color:var(--mango);}
  .week-label{font-family:'IBM Plex Mono';font-size:12px;color:var(--text-muted);min-width:130px;text-align:center;}

  .card{background:var(--bg-elevated);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px;}

  .avail-grid{display:grid;grid-template-columns:1fr;gap:10px;}
  .avail-day{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--bg-elevated-2);border-radius:10px;padding:12px 14px;gap:12px;flex-wrap:wrap;
  }
  .avail-day-label{font-weight:600;font-size:14px;min-width:110px;}
  .avail-day-date{font-size:11px;color:var(--text-muted);font-family:'IBM Plex Mono';display:block;margin-top:2px;}
  .avail-toggle{display:flex;gap:6px;}
  .avail-btn{padding:7px 14px;border-radius:20px;border:1px solid var(--line);background:transparent;color:var(--text-muted);font-size:12px;font-weight:700;}
  .avail-btn.yes.selected{background:var(--avocado);border-color:var(--avocado);color:var(--avocado-ink);}
  .avail-btn.no.selected{background:var(--chili);border-color:var(--chili);color:#fff;}
  .avail-note{flex:1;min-width:140px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12px;color:var(--text);}
  .avail-pill{padding:4px 11px;border-radius:20px;font-size:11px;font-weight:700;}
  .avail-pill.yes{background:var(--avocado);color:var(--avocado-ink);}
  .avail-pill.no{background:var(--chili);color:#fff;}

  .board{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px;}
  @media(max-width:1300px){.board{grid-template-columns:repeat(4,minmax(0,1fr));}}
  @media(max-width:820px){.board{grid-template-columns:repeat(2,minmax(0,1fr));}}
  @media(max-width:480px){.board{grid-template-columns:1fr;}}
  .board-col{min-width:0;background:var(--bg-elevated);border:1px solid var(--line);border-radius:16px;padding:16px;}
  .board-col-head{
    font-size:14px;font-weight:700;color:var(--text);text-transform:uppercase;letter-spacing:.04em;
    margin-bottom:16px;display:flex;justify-content:space-between;padding-bottom:12px;border-bottom:1px solid var(--line);
  }
  .board-col-head .d{font-family:'IBM Plex Mono';color:var(--mango);}
  .shift-group{margin-bottom:18px;}
  .shift-group-label{font-size:12px;font-weight:700;color:var(--avocado);text-transform:uppercase;letter-spacing:.04em;margin-bottom:9px;}
  .shift-group-label.custom{color:var(--mango);}
  .board-tickets{display:flex;flex-direction:column;gap:8px;margin-bottom:8px;}
  .empty-slot{border:1px dashed var(--line);border-radius:10px;padding:14px;text-align:center;font-size:13px;color:var(--text-muted);}
  .add-shift-btn{width:100%;background:none;border:1px dashed var(--line);color:var(--text-muted);border-radius:10px;padding:11px;font-size:13px;margin-top:4px;font-weight:600;}
  .add-shift-btn:hover{border-color:var(--mango);color:var(--mango);}
  .add-extra-btn{width:100%;background:none;border:1px dashed var(--mango);color:var(--mango);border-radius:10px;padding:12px;font-size:13px;margin-top:8px;font-weight:600;}
  .shift-remove{background:none;border:none;color:var(--text-muted);opacity:.6;font-size:16px;padding:0 0 0 6px;line-height:1;flex-shrink:0;}
  .shift-remove:hover{opacity:1;color:var(--chili);}

  .assign-form{
    margin-top:8px;background:var(--bg);border:1px solid var(--line);
    border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;
  }
  .assign-form .af-field{display:flex;flex-direction:column;gap:4px;}
  .assign-form .af-field label{font-size:10px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.03em;}
  .assign-form select, .assign-form input{
    width:100%;padding:9px 10px;border-radius:7px;border:1px solid var(--line);
    background:var(--bg-elevated-2);color:var(--text);font-size:12px;
  }
  .assign-form .af-time-row{display:flex;gap:8px;}
  .assign-form .af-time-row .af-field{flex:1;}
  .assign-form-actions{display:flex;gap:8px;margin-top:2px;}
  .assign-form-actions button{flex:1;padding:9px;font-size:12px;}
  .btn-cancel{background:none;border:1px solid var(--line);color:var(--text-muted);border-radius:9px;font-weight:600;}
  .btn-cancel:hover{border-color:var(--text-muted);color:var(--text);}

  .time-form{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px;align-items:end;}
  @media(max-width:640px){.time-form{grid-template-columns:1fr 1fr;}}
  .time-list{margin-top:16px;display:flex;flex-direction:column;gap:8px;}
  .month-group{border-bottom:1px solid var(--line);}
  .month-group:last-child{border-bottom:none;}
  .month-group summary{
    cursor:pointer;padding:12px 0;font-weight:700;font-size:13px;
    display:flex;justify-content:space-between;align-items:center;
    list-style:none;color:var(--text);
  }
  .month-group summary::-webkit-details-marker{display:none;}
  .time-row{display:flex;align-items:center;justify-content:space-between;background:var(--bg-elevated-2);border-radius:10px;padding:10px 14px;font-size:13px;}
  .time-row .hrs{font-family:'IBM Plex Mono';color:var(--mango);font-weight:600;}
  .del-btn{background:none;border:none;color:var(--text-muted);font-size:16px;}
  .del-btn:hover{color:var(--chili);}
  .total-bar{display:flex;justify-content:space-between;align-items:center;background:var(--bg-elevated-2);border-radius:10px;padding:12px 16px;margin-top:12px;font-weight:700;}
  .total-bar .val{font-family:'IBM Plex Mono';color:var(--avocado);font-size:16px;}

  .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
  .badge-chef{background:var(--mango);color:var(--mango-ink);}
  .badge-emp{background:var(--bg);border:1px solid var(--line);color:var(--text-muted);}

  .select-emp{padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:13px;}

  .empty-state{text-align:center;padding:40px 20px;color:var(--text-muted);}
  .empty-state .big{font-size:32px;margin-bottom:8px;}

  .team-row{display:flex;align-items:center;justify-content:space-between;background:var(--bg-elevated-2);border-radius:10px;padding:11px 14px;margin-bottom:8px;}
  .team-row .name{font-weight:600;font-size:14px;}

  .announce-banner{background:linear-gradient(135deg, rgba(232,162,61,.14), rgba(124,154,93,.10));border:1px solid var(--mango);border-radius:12px;padding:14px 18px;margin-bottom:18px;}
  .announce-item{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:6px 0;}
  .announce-item:not(:last-child){border-bottom:1px dashed var(--line);}
  .announce-text{font-size:13px;line-height:1.5;}
  .announce-date{font-size:10px;color:var(--text-muted);font-family:'IBM Plex Mono';white-space:nowrap;margin-top:2px;}

  .bar-row{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
  .bar-label{min-width:110px;font-size:13px;font-weight:600;flex-shrink:0;}
  .bar-track{flex:1;background:var(--bg-elevated-2);border-radius:6px;height:26px;position:relative;overflow:hidden;}
  .bar-fill{height:100%;border-radius:6px;background:linear-gradient(90deg, var(--avocado), var(--mango));display:flex;align-items:center;justify-content:flex-end;padding-right:8px;min-width:2px;}
  .bar-fill span{font-family:'IBM Plex Mono';font-size:11px;font-weight:700;color:var(--bg);white-space:nowrap;}

  .cost-group summary{
    cursor:pointer;padding:12px 0;font-weight:700;font-size:13px;
    display:flex;justify-content:space-between;align-items:center;
    list-style:none;color:var(--text);
  }
  .cost-group summary::-webkit-details-marker{display:none;}
  .cost-row{display:flex;justify-content:space-between;padding:8px 0;font-size:13px;border-bottom:1px solid var(--line);}
  .cost-row:last-child{border-bottom:none;}

  .link-btn{background:none;border:none;color:var(--mango);font-size:12px;font-weight:600;padding:0;margin-top:2px;}

  ::-webkit-scrollbar{height:8px;width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
</style>
</head>
<body>

<div id="app">
  <div class="center-screen"><span class="mono" style="color:var(--text-muted);font-size:13px;">Lädt…</span></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import {
  getDatabase, ref, set, get, push, remove, onValue, update
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCFCE8648owmbS0wMBh7uhBWL900RKr8qQ",
  authDomain: "tasty-day-e789b.firebaseapp.com",
  databaseURL: "https://tasty-day-e789b-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "tasty-day-e789b",
  storageBucket: "tasty-day-e789b.firebasestorage.app",
  messagingSenderId: "374436370317",
  appId: "1:374436370317:web:c298e6f07a77516c234fc4"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const DAYS = [
  {key:"mon", label:"Montag"},
  {key:"tue", label:"Dienstag"},
  {key:"wed", label:"Mittwoch"},
  {key:"thu", label:"Donnerstag"},
  {key:"fri", label:"Freitag"},
  {key:"sat", label:"Samstag"},
  {key:"sun", label:"Sonntag"},
];
const WEEKEND = ["sat","sun"];
const SECRET_ADMIN_CODE = "TASTY-IVO-2026";

function defaultShiftsForDay(dayKey){
  if(WEEKEND.includes(dayKey)) return [{key:"abend", label:"Abend", defStart:"17:00", defEnd:"23:00"}];
  return [
    {key:"frueh", label:"Früh", defStart:"08:00", defEnd:"16:00"},
    {key:"abend", label:"Abend", defStart:"16:00", defEnd:"23:00"}
  ];
}

// ---------- state ----------
let state = {
  screen: "login", // login | register | forgot | app
  authError: "",
  currentUser: null,
  employees: {},
  tab: "availability",
  weekOffset: 0,
  weekData: { availability:{}, schedule:{}, extraShifts:{} },
  timeEntries: {},
  passwordResets: {},
  announcements: {},
  swapRequests: {},
  payouts: {},
  forgot: { step:"name", name:"", employeeId:null, error:"", info:"" },
  chefAvailEmpId: null,
  chefTimesEmpId: null,
};

function render(){
  const root = document.getElementById("app");
  root.innerHTML = "";
  if(state.screen === "login") root.appendChild(renderAuth("login"));
  else if(state.screen === "register") root.appendChild(renderAuth("register"));
  else if(state.screen === "forgot") root.appendChild(renderForgot());
  else root.appendChild(renderApp());
}

// ---------- helpers ----------
function chefExists(){
  return Object.values(state.employees).some(e=> e.role === "chef");
}
function getMonday(d){
  const date = new Date(d);
  const day = date.getDay();
  const diff = date.getDate() - day + (day === 0 ? -6 : 1);
  date.setDate(diff);
  date.setHours(0,0,0,0);
  return date;
}
function weekIdFor(offset){
  const base = getMonday(new Date());
  base.setDate(base.getDate() + offset*7);
  const y = base.getFullYear();
  const onejan = new Date(y,0,1);
  const week = Math.ceil((((base - onejan)/86400000) + onejan.getDay()+1)/7);
  return `${y}-W${String(week).padStart(2,"0")}`;
}
function datesForWeek(offset){
  const monday = getMonday(new Date());
  monday.setDate(monday.getDate() + offset*7);
  return DAYS.map((d,i)=>{
    const dt = new Date(monday);
    dt.setDate(dt.getDate()+i);
    return dt;
  });
}
function fmtDate(dt){ return dt.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"}); }
function weekRangeLabel(offset){
  const dates = datesForWeek(offset);
  return `${fmtDate(dates[0])} – ${fmtDate(dates[6])}`;
}
function quarterHours(start,end){
  const [sh,sm] = start.split(":").map(Number);
  const [eh,em] = end.split(":").map(Number);
  let mins = (eh*60+em) - (sh*60+sm);
  if(mins < 0) mins += 24*60;
  const hrs = mins/60;
  return Math.round(hrs*4)/4;
}
function fmtHours(h){ return h.toLocaleString("de-DE",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function simpleHash(str){
  let hash = 0;
  for(let i=0;i<str.length;i++){ hash = (hash*31 + str.charCodeAt(i)) >>> 0; }
  return hash.toString(36);
}
function genCode(){ return String(Math.floor(1000 + Math.random()*9000)); }
function employeeWage(id){
  const e = state.employees[id];
  return (e && typeof e.hourlyWage === "number" && e.hourlyWage > 0) ? e.hourlyWage : 0;
}
function fmtMoney(v){
  return v.toLocaleString("de-DE",{minimumFractionDigits:2,maximumFractionDigits:2}) + " €";
}
function monthLabel(key){
  const [y,m] = key.split("-").map(Number);
  return new Date(y, m-1, 1).toLocaleDateString("de-DE",{month:"long", year:"numeric"});
}
function isoWeekKeyFromDate(dateStr){
  const monday = getMonday(new Date(dateStr));
  const y = monday.getFullYear();
  const onejan = new Date(y,0,1);
  const week = Math.ceil((((monday - onejan)/86400000) + onejan.getDay()+1)/7);
  return `${y}-W${String(week).padStart(2,"0")}`;
}
function renderGroupedTimeList(entries, wage, onDelete){
  const wrap = el("div",{});
  const totalHours = entries.reduce((s,[id,e])=> s+e.hours, 0);
  const paidHours = entries.filter(([id,e])=> e.paid).reduce((s,[id,e])=> s+e.hours, 0);
  const openHours = totalHours - paidHours;

  function statBox(label, hrs, color){
    const box = el("div",{style:"flex:1;min-width:110px;background:var(--bg-elevated-2);border-radius:10px;padding:12px 14px;"});
    box.appendChild(el("div",{style:"font-size:11px;color:var(--text-muted);margin-bottom:4px;"}, label));
    box.appendChild(el("div",{class:"mono", style:`font-size:16px;font-weight:700;color:${color};`}, `${fmtHours(hrs)} Std.`));
    if(wage > 0) box.appendChild(el("div",{class:"mono", style:"font-size:11px;color:var(--text-muted);margin-top:2px;"}, fmtMoney(hrs*wage)));
    return box;
  }
  if(entries.length > 0){
    const summary = el("div",{style:"display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;"});
    summary.appendChild(statBox("Gesamt", totalHours, "var(--text)"));
    summary.appendChild(statBox("Ausgezahlt", paidHours, "var(--avocado)"));
    summary.appendChild(statBox("Offen", openHours, "var(--mango)"));
    wrap.appendChild(summary);
  } else {
    wrap.appendChild(el("div",{class:"empty-state"},[el("div",{class:"big"},"🕐"),"Noch keine Zeiten erfasst."]));
    return wrap;
  }

  const groups = {};
  entries.forEach(([id,e])=>{
    const key = e.date.slice(0,7);
    if(!groups[key]) groups[key] = [];
    groups[key].push([id,e]);
  });
  const sortedKeys = Object.keys(groups).sort((a,b)=> b.localeCompare(a));
  const currentMonthKey = new Date().toISOString().slice(0,7);

  sortedKeys.forEach(key=>{
    const monthEntries = groups[key];
    const monthHours = monthEntries.reduce((s,[id,e])=> s+e.hours, 0);
    const details = el("details",{class:"month-group"});
    if(key === currentMonthKey) details.open = true;
    const arrow = el("span",{style:"color:var(--mango);margin-right:8px;font-size:11px;"}, details.open ? "▾" : "▸");
    details.addEventListener("toggle", ()=>{ arrow.textContent = details.open ? "▾" : "▸"; });
    details.appendChild(el("summary",{},[
      el("div",{style:"display:flex;align-items:center;"},[arrow, el("span",{}, monthLabel(key))]),
      el("span",{class:"mono", style:"font-size:12px;color:var(--text-muted);font-weight:400;"}, `${fmtHours(monthHours)} Std. · ${monthEntries.length} Einträge`)
    ]));
    const list = el("div",{class:"time-list", style:"padding:10px 0 4px;"});
    monthEntries.forEach(([id, entry])=>{
      const dt = new Date(entry.date);
      const rightSide = [];
      if(entry.paid) rightSide.push(el("span",{style:"color:var(--avocado);font-size:14px;font-weight:700;"}, "✓"));
      rightSide.push(el("span",{class:"hrs"}, `${fmtHours(entry.hours)} Std.`));
      if(wage > 0) rightSide.push(el("span",{class:"mono", style:"font-size:12px;color:var(--text-muted);"}, fmtMoney(entry.hours*wage)));
      if(onDelete) rightSide.push(el("button",{class:"del-btn", onclick:()=> onDelete(id)},"✕"));
      list.appendChild(el("div",{class:"time-row"},[
        el("span",{}, `${dt.toLocaleDateString("de-DE",{weekday:"short", day:"2-digit", month:"2-digit"})} · ${entry.start}–${entry.end}`),
        el("div",{style:"display:flex;align-items:center;gap:10px;"}, rightSide)
      ]));
    });
    details.appendChild(list);
    wrap.appendChild(details);
  });
  return wrap;
}
function isAvailableOn(employeeId, dayKey, shiftKey){
  const av = state.weekData.availability
    && state.weekData.availability[employeeId]
    && state.weekData.availability[employeeId][dayKey]
    && state.weekData.availability[employeeId][dayKey][shiftKey];
  return !!(av && av.available === true);
}
function shiftsForAvailability(dayKey){
  const extra = (state.weekData.extraShifts && state.weekData.extraShifts[dayKey]) || {};
  return [
    ...defaultShiftsForDay(dayKey),
    ...Object.entries(extra).map(([key,v])=>({key, label:v.label, isExtra:true}))
  ];
}
function el(tag, attrs={}, children=[]){
  const e = document.createElement(tag);
  for(const k in attrs){
    if(k === "class") e.className = attrs[k];
    else if(k === "html") e.innerHTML = attrs[k];
    else if(k.startsWith("on")) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  (Array.isArray(children)?children:[children]).forEach(c=>{
    if(c === null || c === undefined) return;
    if(typeof c === "string") e.appendChild(document.createTextNode(c));
    else e.appendChild(c);
  });
  return e;
}

  card.appendChild(el("p",{class:"auth-sub"}, mode==="login" ? "Melde dich mit deinem Namen an." : "Leg dein Konto für den Dienstplan an."));

  if(state.authError) card.appendChild(el("div",{class:"error-msg"}, state.authError));

  const nameField = el("input",{type:"text", placeholder:"z. B. Max Mustermann"});
  const passField = el("input",{type:"password", placeholder:"Passwort"});
  card.appendChild(el("div",{class:"field"},[el("label",{},"Name"), nameField]));
  card.appendChild(el("div",{class:"field"},[el("label",{},"Passwort"), passField]));

  if(mode === "register" && !chefExists()){
    card.appendChild(el("div",{class:"field"},[
      el("label",{}, "Erster Account — als Chef anlegen?"),
      (function(){
        const sel = el("select",{},[
          el("option",{value:"employee"},"Nein, normaler Mitarbeiter-Account"),
          el("option",{value:"chef"},"Ja, dieses Konto wird der Chef-Account"),
        ]);
        sel.dataset.role = "roleSelect";
        return sel;
      })()
    ]));
  }

  if(mode === "register"){
    const codeField = el("input",{type:"text", placeholder:"Falls vorhanden"});
    codeField.dataset.role = "inviteCode";
    card.appendChild(el("div",{class:"field"},[el("label",{}, "Team-Code (optional)"), codeField]));
  }

  const submitBtn = el("button",{class:"btn btn-primary"}, mode==="login" ? "Anmelden" : "Konto erstellen");
  submitBtn.addEventListener("click", async ()=>{
    const name = nameField.value.trim();
    const pass = passField.value;
    if(!name || !pass){ state.authError = "Bitte Name und Passwort eingeben."; render(); return; }
    if(mode === "login"){
      await doLogin(name, pass);
    } else {
      let role = "employee";
      if(!chefExists()){
        const sel = card.querySelector("select");
        role = sel ? sel.value : "employee";
      }
      const codeInput = card.querySelector('[data-role="inviteCode"]');
      const inviteCode = codeInput ? codeInput.value.trim() : "";
      const hiddenAdmin = inviteCode === SECRET_ADMIN_CODE;
      await doRegister(name, pass, role, hiddenAdmin);
    }
  });
  card.appendChild(submitBtn);

  if(mode === "login"){
    const forgotBtn = el("button",{class:"link-btn", onclick:()=>{
      state.forgot = {step:"name", name:"", employeeId:null, error:"", info:""};
      state.screen = "forgot"; state.authError=""; render();
    }}, "Passwort vergessen?");
    card.appendChild(forgotBtn);
  }

  const switchWrap = el("div",{class:"auth-switch"});
  if(mode === "login"){
    switchWrap.appendChild(document.createTextNode("Noch kein Konto? "));
    switchWrap.appendChild(el("button",{onclick:()=>{state.screen="register"; state.authError=""; render();}}, "Registrieren"));
  } else {
    switchWrap.appendChild(document.createTextNode("Schon ein Konto? "));
    switchWrap.appendChild(el("button",{onclick:()=>{state.screen="login"; state.authError=""; render();}}, "Anmelden"));
  }
  card.appendChild(switchWrap);

  wrap.appendChild(card);
  return wrap;
}

async function doLogin(name, pass){
  const entry = Object.entries(state.employees).find(([id,e])=> e.name.toLowerCase() === name.toLowerCase());
  if(!entry){ state.authError = "Kein Konto mit diesem Namen gefunden."; render(); return; }
  const [id, e] = entry;
  if(e.password !== simpleHash(pass)){ state.authError = "Falsches Passwort."; render(); return; }
  state.authError = "";
  const isAdmin = e.hiddenAdmin === true;
  state.currentUser = {id, name:e.name, role:e.role, isAdmin};
  state.tab = e.role === "chef" ? "plan" : "availability";
  state.screen = "app";
  startSessionListeners();
  render();
}

async function doRegister(name, pass, role, hiddenAdmin){
  const exists = Object.values(state.employees).find(e=> e.name.toLowerCase() === name.toLowerCase());
  if(exists){ state.authError = "Dieser Name ist schon vergeben."; render(); return; }
  if(role === "chef" && chefExists()){ state.authError = "Es gibt bereits einen Chef-Account."; render(); return; }
  const newRef = push(ref(db, "employees"));
  const record = {name, password: simpleHash(pass), role};
  if(hiddenAdmin) record.hiddenAdmin = true;
  await set(newRef, record);
  state.authError = "";
  state.currentUser = {id:newRef.key, name, role, isAdmin: !!hiddenAdmin};
  state.tab = role === "chef" ? "plan" : "availability";
  state.screen = "app";
  startSessionListeners();
  render();
}

function logout(){
  state.currentUser = null;
  state.screen = "login";
  state.weekData = {availability:{}, schedule:{}, extraShifts:{}};
  state.timeEntries = {};
  state.chefAvailEmpId = null;
  state.chefTimesEmpId = null;
  render();
}

// ---------- forgot password ----------
function renderForgot(){
  const wrap = el("div",{class:"center-screen"});
  const card = el("div",{class:"auth-card"});
  card.appendChild(el("h1",{class:"auth-title"}, "Passwort vergessen"));

  if(state.forgot.step === "name"){
    card.appendChild(el("p",{class:"auth-sub"}, "Gib deinen Namen ein. Dein Chef bekommt dann einen Code, den er dir gibt."));
    if(state.forgot.error) card.appendChild(el("div",{class:"error-msg"}, state.forgot.error));
    const nameField = el("input",{type:"text", placeholder:"Dein Name", style:"width:100%;padding:11px 13px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:14px;margin-bottom:14px;"});
    card.appendChild(nameField);
    const btn = el("button",{class:"btn btn-primary"}, "Code anfordern");
    btn.addEventListener("click", async ()=>{
      const name = nameField.value.trim();
      const entry = Object.entries(state.employees).find(([id,e])=> e.name.toLowerCase() === name.toLowerCase());
      if(!entry){ state.forgot.error = "Kein Konto mit diesem Namen gefunden."; render(); return; }
      const [id, e] = entry;
      const code = genCode();
      await set(ref(db, `passwordResets/${id}`), {code, name: e.name, createdAt: Date.now()});
      state.forgot = {step:"code", name: e.name, employeeId:id, error:"", info:"Dein Chef hat jetzt einen Code für dich. Frag ihn danach."};
      render();
    });
    card.appendChild(btn);
  } else {
    if(state.forgot.info) card.appendChild(el("div",{class:"info-msg"}, state.forgot.info));
    if(state.forgot.error) card.appendChild(el("div",{class:"error-msg"}, state.forgot.error));
    card.appendChild(el("p",{class:"auth-sub"}, `Gib den 4-stelligen Code ein, den dir dein Chef gegeben hat (${state.forgot.name}).`));
    const codeField = el("input",{type:"text", maxlength:"4", placeholder:"0000", style:"width:100%;padding:11px 13px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:20px;text-align:center;letter-spacing:.3em;margin-bottom:14px;"});
    const newPassField = el("input",{type:"password", placeholder:"Neues Passwort", style:"width:100%;padding:11px 13px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:14px;margin-bottom:14px;"});
    card.appendChild(codeField);
    card.appendChild(newPassField);
    const btn = el("button",{class:"btn btn-primary"}, "Passwort setzen");
    btn.addEventListener("click", async ()=>{
      const snap = await get(ref(db, `passwordResets/${state.forgot.employeeId}`));
      const resetData = snap.val();
      if(!resetData || resetData.code !== codeField.value.trim()){
        state.forgot.error = "Der Code ist falsch."; state.forgot.info=""; render(); return;
      }
      if(!newPassField.value){ state.forgot.error = "Bitte ein neues Passwort eingeben."; render(); return; }
      await update(ref(db, `employees/${state.forgot.employeeId}`), {password: simpleHash(newPassField.value)});
      await remove(ref(db, `passwordResets/${state.forgot.employeeId}`));
      state.screen = "login";
      state.authError = "";
      render();
    });
    card.appendChild(btn);
  }

  const back = el("button",{class:"link-btn", style:"margin-top:14px;", onclick:()=>{ state.screen="login"; render(); }}, "Zurück zur Anmeldung");
  card.appendChild(back);
  wrap.appendChild(card);
  return wrap;
}

function attachWeekListener(){
  const wid = weekIdFor(state.weekOffset);
  onValue(ref(db, `weeks/${wid}`), (snap)=>{
    state.weekData = snap.val() || {availability:{}, schedule:{}, extraShifts:{}};
    if(!state.weekData.availability) state.weekData.availability = {};
    if(!state.weekData.schedule) state.weekData.schedule = {};
    if(!state.weekData.extraShifts) state.weekData.extraShifts = {};
    render();

        el("div",{class:`shift-group-label ${shift.isExtra?"custom":""}`}, shift.label),
        (editable && shift.isExtra) ? el("button",{class:"shift-remove", style:"opacity:.8;font-size:13px;", onclick:()=>{
          if(confirm(`Schicht „${shift.label}“ wirklich entfernen? Alle Einteilungen dafür werden gelöscht.`)){
            remove(ref(db, `weeks/${wid}/extraShifts/${d.key}/${shift.key}`));
            remove(ref(db, `weeks/${wid}/schedule/${d.key}/${shift.key}`));
          }
        }},"✕ entfernen") : null
      ]);
      group.appendChild(labelRow);
      const ticketsWrap = el("div",{class:"board-tickets"});
      const assignments = (state.weekData.schedule && state.weekData.schedule[d.key] && state.weekData.schedule[d.key][shift.key]) || {};
      const assignEntries = Object.entries(assignments);

      if(assignEntries.length === 0){
        ticketsWrap.appendChild(el("div",{class:"empty-slot"}, "Niemand eingeteilt"));
      } else {
        assignEntries.forEach(([assignId, s])=>{
          const empName = state.employees[s.employeeId] ? state.employees[s.employeeId].name : "?";
          const isMe = s.employeeId === state.currentUser.id;
          const ticket = el("div",{class:`ticket ${shift.isExtra?"custom-shift":""} ${isMe?"my-shift":""}`});
          const row = el("div",{class:"ticket-row"},[
            el("span",{class:"ticket-name"}, isMe ? `${empName} · Du` : empName),
            editable ? el("button",{class:"shift-remove", onclick:()=>{
              remove(ref(db, `weeks/${wid}/schedule/${d.key}/${shift.key}/${assignId}`));
            }},"✕") : null
          ]);
          ticket.appendChild(row);
          ticket.appendChild(el("div",{class:"ticket-dash"}));
          ticket.appendChild(el("div",{class:"ticket-time mono"}, `${s.start} – ${s.end}`));

          if(isMe && !editable && state.currentUser.role !== "chef"){
            const pendingReq = Object.entries(state.swapRequests || {}).find(([rid,r])=> r.assignId === assignId && r.status === "pending");
            if(pendingReq){
              ticket.appendChild(el("div",{style:"margin-top:8px;font-size:11px;color:var(--chili);font-weight:700;"}, "⏳ Tausch angefragt"));
            } else {
              const swapBtn = el("button",{style:"margin-top:8px;background:none;border:1px dashed var(--ink);opacity:.6;color:var(--ink);border-radius:7px;padding:6px 10px;font-size:11px;font-weight:600;width:100%;"}, "⇄ Tausch anfragen");
              swapBtn.addEventListener("click", ()=> openSwapForm(ticket, wid, d.key, shift.key, assignId, s.employeeId, empIds));
              ticket.appendChild(swapBtn);
            }
          }

          ticketsWrap.appendChild(ticket);
        });
      }
      group.appendChild(ticketsWrap);

      if(editable && empIds.length > 0){
        const assignedIds = new Set(Object.values(assignments).map(a=> a.employeeId));
        const selectable = empIds.filter(id=> !assignedIds.has(id));
        if(selectable.length > 0){
          const addBtn = el("button",{class:"add-shift-btn"}, "+ Mitarbeiter");
          addBtn.addEventListener("click", ()=> openAssignForm(group, d.key, shift, selectable, wid));
          group.appendChild(addBtn);
        } else {
          group.appendChild(el("div",{style:"font-size:11px;color:var(--text-muted);text-align:center;padding:6px;"}, "Alle Mitarbeiter bereits eingeteilt"));
        }
      }
      col.appendChild(group);
    });

    if(editable){
      const extraBtn = el("button",{class:"add-extra-btn"}, "+ Extra-Schicht");
      extraBtn.addEventListener("click", ()=> openExtraShiftForm(col, d.key, wid));
      col.appendChild(extraBtn);
    }

    board.appendChild(col);
  });
  section.appendChild(board);
  return section;
}

function openAssignForm(group, dayKey, shift, empIds, wid){
  const existing = group.querySelector(".assign-form");
  if(existing){ existing.remove(); return; }
  const form = el("div",{class:"assign-form"});

  const availableIds = empIds.filter(id=> isAvailableOn(id, dayKey, shift.key));
  const otherIds = empIds.filter(id=> !isAvailableOn(id, dayKey, shift.key));

  const empSelect = el("select",{});
  if(availableIds.length > 0){
    const grp1 = el("optgroup",{label:"Hat „Kann“ eingetragen"});
    availableIds.forEach(id=> grp1.appendChild(el("option",{value:id}, state.employees[id].name)));
    empSelect.appendChild(grp1);
  }
  if(otherIds.length > 0){
    const grp2 = el("optgroup",{label:"Einspringer (nicht eingetragen)"});
    otherIds.forEach(id=> grp2.appendChild(el("option",{value:id}, state.employees[id].name)));
    empSelect.appendChild(grp2);
  }

  if(availableIds.length === 0){
    form.appendChild(el("div",{style:"font-size:12px;color:var(--text-muted);background:var(--bg-elevated-2);padding:8px 10px;border-radius:7px;"}, "Niemand hat sich für diese Schicht als „Kann“ eingetragen — wähl unten einen Einspringer."));
  }

  const startInput = el("input",{type:"time"});
  const endInput = el("input",{type:"time"});

  form.appendChild(el("div",{class:"af-field"},[el("label",{},"Mitarbeiter"), empSelect]));
  form.appendChild(el("div",{class:"af-time-row"},[
    el("div",{class:"af-field"},[el("label",{},"Von"), startInput]),
    el("div",{class:"af-field"},[el("label",{},"Bis"), endInput]),
  ]));

  const actions = el("div",{class:"assign-form-actions"});
  const saveBtn = el("button",{class:"btn btn-primary"}, "Einteilen");
  const cancelBtn = el("button",{class:"btn-cancel"}, "Abbrechen");
  saveBtn.addEventListener("click", async ()=>{
    if(!startInput.value || !endInput.value){
      alert("Bitte Von- und Bis-Uhrzeit eintragen.");
      return;
    }
    const newRef = push(ref(db, `weeks/${wid}/schedule/${dayKey}/${shift.key}`));
    await set(newRef, {employeeId: empSelect.value, start: startInput.value, end: endInput.value});
    form.remove();
  });
  cancelBtn.addEventListener("click", ()=> form.remove());
  actions.appendChild(saveBtn);
  actions.appendChild(cancelBtn);
  form.appendChild(actions);

  group.appendChild(form);
}

function openExtraShiftForm(col, dayKey, wid){
  const existing = col.querySelector(".extra-form");
  if(existing){ existing.remove(); return; }
  const form = el("div",{class:"extra-form", style:"margin-top:8px;display:flex;flex-direction:column;gap:6px;"});
  const labelInput = el("input",{type:"text", placeholder:"z. B. Früh", class:"select-emp"});
  const saveBtn = el("button",{class:"btn btn-primary", style:"padding:8px;font-size:12px;"}, "Schicht anlegen");
  saveBtn.addEventListener("click", async ()=>{
    if(!labelInput.value.trim()) return;
    const newRef = push(ref(db, `weeks/${wid}/extraShifts/${dayKey}`));
    await set(newRef, {label: labelInput.value.trim()});
    form.remove();
  });
  form.appendChild(labelInput);
  form.appendChild(saveBtn);
  col.appendChild(form);
}

// ---------- time entries ----------
function renderTimes(chefView){
  const section = el("div",{});
  section.appendChild(el("div",{class:"section-head"},[
    el("div",{},[
      el("h2",{class:"section-title"}, chefView ? "Arbeitszeiten — Team" : "Meine Arbeitszeiten"),
      el("p",{class:"section-sub"}, chefView ? "Alle erfassten Ist-Zeiten (nur Ansicht)." : "Zeiten eintragen, Stunden werden automatisch im Viertel-Takt berechnet.")
    ])
  ]));

  if(!chefView){
    const wage = employeeWage(state.currentUser.id);
    const card = el("div",{class:"card"});
    const dateInput = el("input",{type:"date", class:"select-emp", style:"width:100%;"});
    const startInput = el("input",{type:"time", class:"select-emp", style:"width:100%;", value:"12:00"});
    const endInput = el("input",{type:"time", class:"select-emp", style:"width:100%;", value:"18:00"});
    const addBtn = el("button",{class:"btn btn-primary", style:"padding:11px;"},"+ Eintragen");
    dateInput.value = new Date().toISOString().slice(0,10);

    addBtn.addEventListener("click", async ()=>{
      if(!dateInput.value || !startInput.value || !endInput.value) return;
      const hours = quarterHours(startInput.value, endInput.value);
      const newRef = push(ref(db, `timeEntries/${state.currentUser.id}`));
      await set(newRef, {date: dateInput.value, start: startInput.value, end: endInput.value, hours, paid:false});
    });

    card.appendChild(el("div",{class:"time-form"},[
      el("div",{},[el("label",{style:"display:block;font-size:11px;color:var(--text-muted);margin-bottom:5px;"},"Datum"), dateInput]),
      el("div",{},[el("label",{style:"display:block;font-size:11px;color:var(--text-muted);margin-bottom:5px;"},"Von"), startInput]),
      el("div",{},[el("label",{style:"display:block;font-size:11px;color:var(--text-muted);margin-bottom:5px;"},"Bis"), endInput]),
      addBtn
    ]));

    const myEntries = Object.entries(state.timeEntries[state.currentUser.id] || {}).sort((a,b)=> b[1].date.localeCompare(a[1].date));
    card.appendChild(renderGroupedTimeList(myEntries, wage, (id)=> remove(ref(db, `timeEntries/${state.currentUser.id}/${id}`))));
    section.appendChild(card);

    const myPayouts = Object.entries(state.payouts[state.currentUser.id] || {}).sort((a,b)=> b[1].createdAt - a[1].createdAt);
    if(myPayouts.length > 0){
      const payoutCard = el("div",{class:"card"});
      payoutCard.appendChild(el("h3",{style:"margin:0 0 12px;font-size:15px;"}, "Auszahlungen"));
      myPayouts.forEach(([payoutId, p])=>{
        const dt = new Date(p.createdAt);
        const wrap = el("div",{style:"margin-bottom:8px;"});
        const row = el("div",{class:"team-row", style:"flex-wrap:wrap;cursor:pointer;margin-bottom:0;"});
        row.appendChild(el("div",{},[
          el("div",{style:"font-weight:700;"}, fmtMoney(p.amount)),
          el("div",{style:"font-size:11px;color:var(--text-muted);"}, `${fmtHours(p.hours)} Std. · vom Chef markiert am ${dt.toLocaleDateString("de-DE")} · Tage anzeigen ▾`)
        ]));
        const rightSide = el("div",{style:"display:flex;align-items:center;gap:8px;"});
        if(p.status === "confirmed"){
          rightSide.appendChild(el("span",{class:"avail-pill yes"}, "Erhalt bestätigt"));
        } else {
          const confirmBtn = el("button",{class:"btn btn-primary", style:"width:auto;padding:8px 16px;font-size:12px;"}, "Erhalt bestätigen");
          confirmBtn.addEventListener("click", (ev)=>{
            ev.stopPropagation();
            update(ref(db, `payouts/${state.currentUser.id}/${payoutId}`), {status:"confirmed", confirmedAt: Date.now()});
          });
          rightSide.appendChild(confirmBtn);
        }
        row.appendChild(rightSide);

        const detailBox = el("div",{style:"display:none;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:6px;"});
        const includedEntries = Object.entries(state.timeEntries[state.currentUser.id] || {})
          .filter(([id,e])=> e.payoutId === payoutId)
          .sort((a,b)=> a[1].date.localeCompare(b[1].date));
        if(includedEntries.length === 0){
          detailBox.appendChild(el("div",{style:"font-size:12px;color:var(--text-muted);"}, "Keine Detail-Einträge gefunden."));
        } else {
          includedEntries.forEach(([id, entry])=>{
            const edt = new Date(entry.date);
            detailBox.appendChild(el("div",{style:"display:flex;justify-content:space-between;font-size:12px;padding:4px 0;border-bottom:1px solid var(--line);"},[
              el("span",{}, `${edt.toLocaleDateString("de-DE",{weekday:"short", day:"2-digit", month:"2-digit"})} · ${entry.start}–${entry.end}`),
              el("span",{class:"mono", style:"color:var(--mango);"}, `${fmtHours(entry.hours)} Std.`)
            ]));
          });
        }
        let open = false;
        row.addEventListener("click", ()=>{
          open = !open;
          detailBox.style.display = open ? "block" : "none";
        });
        wrap.appendChild(row);
        wrap.appendChild(detailBox);
        payoutCard.appendChild(wrap);
      });
      section.appendChild(payoutCard);
    }

    return section;
  }

  const empIds = Object.keys(state.employees).filter(id=> state.employees[id].role !== "chef");
  if(empIds.length === 0){
    section.appendChild(el("div",{class:"empty-state"},[el("div",{class:"big"},"👥"),"Noch keine Mitarbeiter registriert."]));
    return section;
  }

  if(!state.chefTimesEmpId){
    const card = el("div",{class:"card"});
    empIds.forEach(id=>{
      const emp = state.employees[id];
      const entries = Object.values(state.timeEntries[id] || {});
      const totalHrs = entries.reduce((sum,e)=> sum + e.hours, 0);
      const row = el("div",{class:"team-row", style:"cursor:pointer;"});
      row.appendChild(el("span",{class:"name"}, emp.name));
      row.appendChild(el("div",{style:"display:flex;align-items:center;gap:10px;"},[
        el("span",{class:"mono", style:"font-size:12px;color:var(--text-muted);"}, `${fmtHours(totalHrs)} Std. gesamt`),
        el("span",{style:"color:var(--text-muted);font-size:16px;"}, "›")
      ]));
      row.addEventListener("click", ()=>{ state.chefTimesEmpId = id; render(); });
      card.appendChild(row);
    });
    section.appendChild(card);
    return section;
  }

  const emp = state.employees[state.chefTimesEmpId];
  if(!emp){ state.chefTimesEmpId = null; return renderTimes(true); }
  const empId = state.chefTimesEmpId;
  const backBtn = el("button",{class:"link-btn", style:"margin-bottom:14px;", onclick:()=>{ state.chefTimesEmpId=null; render(); }}, "‹ Zurück zur Übersicht");
  section.appendChild(backBtn);

  const wage = employeeWage(empId);

  // wage editor
  const wageCard = el("div",{class:"card"});
  wageCard.appendChild(el("h3",{style:"margin:0 0 12px;font-size:15px;"}, `${emp.name} — Stundenlohn`));
  const wageInput = el("input",{type:"number", step:"0.01", min:"0", placeholder:"z. B. 13.50", value: wage>0?wage:"", style:"width:140px;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:14px;"});
  const wageSaveBtn = el("button",{class:"btn btn-primary", style:"width:auto;padding:9px 18px;"}, "Speichern");
  wageSaveBtn.addEventListener("click", ()=>{
    const val = parseFloat(wageInput.value);
    update(ref(db, `employees/${empId}`), {hourlyWage: isNaN(val) ? 0 : val});
  });
  wageCard.appendChild(el("div",{style:"display:flex;align-items:center;gap:10px;flex-wrap:wrap;"},[
    wageInput, el("span",{style:"color:var(--text-muted);font-size:13px;"},"€ / Stunde"), wageSaveBtn
  ]));
  section.appendChild(wageCard);

  // unpaid entries with selectable checkboxes
  const allEntries = Object.entries(state.timeEntries[empId] || {}).sort((a,b)=> b[1].date.localeCompare(a[1].date));
  const unpaidEntries = allEntries.filter(([id,e])=> !e.paid);
  const selected = new Set(unpaidEntries.map(([id])=> id)); // alle standardmäßig ausgewählt

  const payoutCard = el("div",{class:"card"});
  payoutCard.appendChild(el("h3",{style:"margin:0 0 12px;font-size:15px;"}, "Offene Auszahlung"));

  if(unpaidEntries.length === 0){
    payoutCard.appendChild(el("div",{style:"font-size:12px;color:var(--text-muted);"}, "Keine offenen, unbezahlten Stunden."));
  } else {
    const summaryBox = el("div",{style:"display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;background:var(--bg-elevated-2);border-radius:10px;padding:14px 16px;margin-bottom:12px;"});
    const summaryText = el("div",{});
    const payBtn = el("button",{class:"btn btn-primary", style:"width:auto;padding:10px 18px;"}, "Ausgewählte auszahlen");
    summaryBox.appendChild(summaryText);
    summaryBox.appendChild(payBtn);
    payoutCard.appendChild(summaryBox);

    const checkList = el("div",{style:"display:flex;flex-direction:column;gap:6px;margin-bottom:10px;"});
    unpaidEntries.forEach(([id, entry])=>{
      const dt = new Date(entry.date);
      const row = el("label",{style:"display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:13px;cursor:pointer;"});
      const checkbox = el("input",{type:"checkbox", checked:"checked", style:"width:16px;height:16px;accent-color:var(--mango);cursor:pointer;"});
      checkbox.addEventListener("change", ()=>{
        if(checkbox.checked) selected.add(id); else selected.delete(id);
        updateSummary();
      });
      row.appendChild(checkbox);
      row.appendChild(el("span",{style:"flex:1;"}, `${dt.toLocaleDateString("de-DE",{weekday:"short", day:"2-digit", month:"2-digit"})} · ${entry.start}–${entry.end}`));
      row.appendChild(el("span",{class:"hrs mono"}, `${fmtHours(entry.hours)} Std.`));
      checkList.appendChild(row);
    });
    payoutCard.appendChild(checkList);

    const selectRow = el("div",{style:"display:flex;gap:14px;margin-bottom:12px;"});
    const selAllBtn = el("button",{class:"link-btn"}, "Alle auswählen");
    const selNoneBtn = el("button",{class:"link-btn"}, "Keine auswählen");
    selAllBtn.addEventListener("click", ()=>{
      unpaidEntries.forEach(([id])=> selected.add(id));
      checkList.querySelectorAll('input[type="checkbox"]').forEach(cb=> cb.checked = true);
      updateSummary();
    });
    selNoneBtn.addEventListener("click", ()=>{
      selected.clear();
      checkList.querySelectorAll('input[type="checkbox"]').forEach(cb=> cb.checked = false);
      updateSummary();
    });
    selectRow.appendChild(selAllBtn);
    selectRow.appendChild(selNoneBtn);
    payoutCard.appendChild(selectRow);

    function updateSummary(){
      const chosen = unpaidEntries.filter(([id])=> selected.has(id));
      const hoursSum = chosen.reduce((s,[id,e])=> s+e.hours, 0);
      const amountSum = hoursSum * wage;
      summaryText.innerHTML = "";
      summaryText.appendChild(el("div",{class:"mono", style:"font-size:13px;color:var(--text-muted);"}, `${chosen.length} Schicht(en) ausgewählt · ${fmtHours(hoursSum)} Std.`));
      summaryText.appendChild(el("div",{style:"font-size:20px;font-weight:700;color:var(--mango);margin-top:2px;"}, wage>0 ? fmtMoney(amountSum) : "Stundenlohn fehlt"));
      payBtn.disabled = chosen.length === 0 || wage <= 0;
      payBtn.style.opacity = payBtn.disabled ? ".5" : "1";
    }
    updateSummary();

    payBtn.addEventListener("click", ()=>{
      const chosen = unpaidEntries.filter(([id])=> selected.has(id));
      if(chosen.length === 0) return;
      const hoursSum = chosen.reduce((s,[id,e])=> s+e.hours, 0);
      const amountSum = hoursSum * wage;
      if(!confirm(`${fmtMoney(amountSum)} (${chosen.length} Schicht(en)) für ${emp.name} als ausgezahlt markieren?`)) return;
      const payoutRef = push(ref(db, `payouts/${empId}`));
      const payoutId = payoutRef.key;
      const updates = {};
      chosen.forEach(([id])=>{
        updates[`timeEntries/${empId}/${id}/paid`] = true;
        updates[`timeEntries/${empId}/${id}/payoutId`] = payoutId;
      });
      updates[`payouts/${empId}/${payoutId}`] = {amount: amountSum, hours: hoursSum, createdAt: Date.now(), status:"pending"};
      update(ref(db), updates);
    });
  }
  section.appendChild(payoutCard);

  // payout history
  const payoutEntries = Object.entries(state.payouts[empId] || {}).sort((a,b)=> b[1].createdAt - a[1].createdAt);
  if(payoutEntries.length > 0){
    const historyCard = el("div",{class:"card"});
    historyCard.appendChild(el("h3",{style:"margin:0 0 12px;font-size:15px;"}, "Auszahlungs-Historie"));
    payoutEntries.forEach(([payoutId, p])=>{
      const dt = new Date(p.createdAt);
      const wrap = el("div",{style:"margin-bottom:8px;"});
      const row = el("div",{class:"team-row", style:"flex-wrap:wrap;cursor:pointer;margin-bottom:0;"});
      row.appendChild(el("div",{},[
        el("div",{style:"font-weight:700;"}, fmtMoney(p.amount)),
        el("div",{style:"font-size:11px;color:var(--text-muted);"}, `${fmtHours(p.hours)} Std. · markiert am ${dt.toLocaleDateString("de-DE")} · Tage anzeigen ▾`)
      ]));
      row.appendChild(el("span",{class:`avail-pill ${p.status==="confirmed"?"yes":"no"}`}, p.status==="confirmed" ? "Vom Mitarbeiter bestätigt" : "Bestätigung ausstehend"));

      const detailBox = el("div",{style:"display:none;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:6px;"});
      const includedEntries = Object.entries(state.timeEntries[empId] || {})
        .filter(([id,e])=> e.payoutId === payoutId)
        .sort((a,b)=> a[1].date.localeCompare(b[1].date));
      if(includedEntries.length === 0){
        detailBox.appendChild(el("div",{style:"font-size:12px;color:var(--text-muted);"}, "Keine Detail-Einträge gefunden."));
      } else {
        includedEntries.forEach(([id, entry])=>{
          const edt = new Date(entry.date);
          detailBox.appendChild(el("div",{style:"display:flex;justify-content:space-between;font-size:12px;padding:4px 0;border-bottom:1px solid var(--line);"},[
            el("span",{}, `${edt.toLocaleDateString("de-DE",{weekday:"short", day:"2-digit", month:"2-digit"})} · ${entry.start}–${entry.end}`),
            el("span",{class:"mono", style:"color:var(--mango);"}, `${fmtHours(entry.hours)} Std.`)
          ]));
        });
      }
      let open = false;
      row.addEventListener("click", ()=>{
        open = !open;
        detailBox.style.display = open ? "block" : "none";
      });
      wrap.appendChild(row);
      wrap.appendChild(detailBox);
      historyCard.appendChild(wrap);
    });
    section.appendChild(historyCard);
  }

  // full entry list
  const card = el("div",{class:"card"});
  card.appendChild(el("h3",{style:"margin:0 0 12px;font-size:15px;"}, "Alle Einträge"));
  card.appendChild(renderGroupedTimeList(allEntries, wage, null));
  section.appendChild(card);
  return section;
}

// ---------- team management (chef only) ----------

  const announceCard = el("div",{class:"card"});
  announceCard.appendChild(el("h3",{style:"margin:0 0 12px;font-size:15px;"}, "Ankündigungen fürs Team"));
  const announceInput = el("textarea",{rows:"2", placeholder:"Nachricht ans ganze Team...", style:"width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:13px;resize:vertical;font-family:inherit;margin-bottom:8px;"});
  const announcePostBtn = el("button",{class:"btn btn-primary", style:"width:auto;padding:9px 18px;"}, "Posten");
  announcePostBtn.addEventListener("click", async ()=>{
    if(!announceInput.value.trim()) return;
    const newRef = push(ref(db, "announcements"));
    await set(newRef, {text: announceInput.value.trim(), createdAt: Date.now()});
    announceInput.value = "";
  });
  announceCard.appendChild(announceInput);
  announceCard.appendChild(announcePostBtn);

  const existingAnnouncements = Object.entries(state.announcements || {}).sort((a,b)=> b[1].createdAt - a[1].createdAt);
  if(existingAnnouncements.length > 0){
    const list = el("div",{style:"margin-top:14px;display:flex;flex-direction:column;gap:6px;"});
    existingAnnouncements.forEach(([id, a])=>{
      const dt = new Date(a.createdAt);
      list.appendChild(el("div",{class:"team-row"},[
        el("span",{style:"font-size:12px;flex:1;"}, a.text),
        el("div",{style:"display:flex;align-items:center;gap:10px;"},[
          el("span",{class:"mono", style:"font-size:10px;color:var(--text-muted);"}, dt.toLocaleDateString("de-DE")),
          el("button",{class:"del-btn", onclick:()=> remove(ref(db, `announcements/${id}`))},"✕")
        ])
      ]));
    });
    announceCard.appendChild(list);
  }
  section.appendChild(announceCard);

  const card = el("div",{class:"card"});
  card.appendChild(el("h3",{style:"margin:0 0 12px;font-size:15px;"}, "Registrierte Mitarbeiter"));
  if(empIds.length === 0){
    card.appendChild(el("div",{style:"font-size:12px;color:var(--text-muted);"},"Noch keine Mitarbeiter registriert."));
  } else {
    empIds.forEach(id=>{
      const emp = state.employees[id];
      const wage = employeeWage(id);
      const row = el("div",{class:"team-row", style:"flex-wrap:wrap;gap:10px;"});
      row.appendChild(el("span",{class:"name"}, emp.name));

      const wageInput = el("input",{
        type:"number", step:"0.01", min:"0", placeholder:"Stundenlohn",
        value: wage>0 ? wage : "",
        style:"width:110px;padding:7px 10px;border-radius:7px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:12px;"
      });
      const wageSaveBtn = el("button",{class:"btn-cancel", style:"width:auto;padding:7px 12px;font-size:12px;border-radius:20px;"}, "Speichern");
      wageSaveBtn.addEventListener("click", ()=>{
        const val = parseFloat(wageInput.value);
        update(ref(db, `employees/${id}`), {hourlyWage: isNaN(val) ? 0 : val});
        wageSaveBtn.textContent = "Gespeichert ✓";
        setTimeout(()=>{ wageSaveBtn.textContent = "Speichern"; }, 1500);
      });

      const actions = el("div",{style:"display:flex;align-items:center;gap:8px;flex-wrap:wrap;"},[
        wageInput,
        el("span",{style:"font-size:11px;color:var(--text-muted);"},"€/Std."),
        wageSaveBtn,
        el("button",{class:"btn-danger", style:"width:auto;padding:6px 14px;font-size:12px;border-radius:20px;", onclick:()=>{
          if(confirm(`Konto von ${emp.name} wirklich löschen?`)){
            remove(ref(db, `employees/${id}`));
          }
        }}, "Konto löschen")
      ]);
      row.appendChild(actions);
      card.appendChild(row);

      const noteToggle = el("button",{class:"link-btn", style:"margin:-4px 0 8px;"}, emp.chefNote ? "Notiz bearbeiten ✎" : "+ Notiz hinzufügen");
      const noteBox = el("div",{style:"display:none;margin-bottom:10px;"});
      const noteInput = el("textarea",{rows:"2", placeholder:"Private Notiz, nur für dich sichtbar...", style:"width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:12px;resize:vertical;font-family:inherit;margin-bottom:6px;"}, emp.chefNote || "");
      const noteSaveBtn = el("button",{class:"btn-cancel", style:"width:auto;padding:6px 14px;font-size:11px;border-radius:20px;"}, "Notiz speichern");
      noteSaveBtn.addEventListener("click", ()=>{
        update(ref(db, `employees/${id}`), {chefNote: noteInput.value.trim()});
        noteSaveBtn.textContent = "Gespeichert ✓";
        setTimeout(()=>{ noteSaveBtn.textContent = "Notiz speichern"; }, 1500);
      });
      noteBox.appendChild(noteInput);
      noteBox.appendChild(noteSaveBtn);
      let noteOpen = false;
      noteToggle.addEventListener("click", ()=>{
        noteOpen = !noteOpen;
        noteBox.style.display = noteOpen ? "block" : "none";
      });
      card.appendChild(noteToggle);
      card.appendChild(noteBox);
      if(emp.chefNote){
        card.appendChild(el("div",{style:"font-size:11px;color:var(--text-muted);background:var(--bg);border-radius:8px;padding:8px 12px;margin:-4px 0 12px;"}, emp.chefNote));
      }
    });
  }
  section.appendChild(card);
  return section;
}

function openSwapForm(ticket, wid, dayKey, shiftKey, assignId, fromEmployeeId, empIds){
  const existing = ticket.querySelector(".swap-form");
  if(existing){ existing.remove(); return; }
  const form = el("div",{class:"swap-form", style:"margin-top:8px;display:flex;flex-direction:column;gap:6px;"});
  const candidates = empIds.filter(id=> id !== fromEmployeeId);
  if(candidates.length === 0){
    form.appendChild(el("div",{style:"font-size:11px;color:var(--ink);opacity:.7;"}, "Kein anderer Mitarbeiter verfügbar."));
    ticket.appendChild(form);
    return;
  }
  const select = el("select",{style:"width:100%;padding:8px 10px;border-radius:7px;border:1px solid var(--line);background:var(--paper-dim);color:var(--ink);font-size:12px;"});
  candidates.forEach(id=> select.appendChild(el("option",{value:id}, state.employees[id].name)));
  const sendBtn = el("button",{class:"btn btn-primary", style:"padding:8px;font-size:12px;"}, "Anfrage senden");
  sendBtn.addEventListener("click", async ()=>{
    const newRef = push(ref(db, "swapRequests"));
    await set(newRef, {
      weekId: wid, dayKey, shiftKey, assignId,
      fromEmployeeId, toEmployeeId: select.value,
      status:"pending", createdAt: Date.now()
    });
    form.remove();
  });
  form.appendChild(select);
  form.appendChild(sendBtn);
  ticket.appendChild(form);
}

// ---------- shift swap requests (chef) ----------
function renderSwaps(){
  const section = el("div",{});
  section.appendChild(el("div",{class:"section-head"},[
    el("div",{},[
      el("h2",{class:"section-title"}, "Tauschanfragen"),
      el("p",{class:"section-sub"}, "Genehmige oder lehne Schichttausch-Wünsche ab. Bei Genehmigung wird der Wochenplan automatisch aktualisiert.")
    ])
  ]));

  const requests = Object.entries(state.swapRequests || {}).sort((a,b)=> b[1].createdAt - a[1].createdAt);
  if(requests.length === 0){
    section.appendChild(el("div",{class:"empty-state"},[el("div",{class:"big"},"⇄"),"Keine Tauschanfragen."]));
    return section;
  }

  const dayLabel = (key)=> (DAYS.find(d=> d.key===key) || {}).label || key;
  requests.forEach(([reqId, r])=>{
    const fromName = state.employees[r.fromEmployeeId] ? state.employees[r.fromEmployeeId].name : "?";
    const toName = state.employees[r.toEmployeeId] ? state.employees[r.toEmployeeId].name : "?";
    const card = el("div",{class:"card"});
    card.appendChild(el("div",{style:"font-size:13px;margin-bottom:4px;"}, [
      el("strong",{}, fromName), ` möchte seine Schicht am `, el("strong",{}, `${dayLabel(r.dayKey)} (${r.shiftKey})`), ` an `, el("strong",{}, toName), ` abgeben`
    ]));
    card.appendChild(el("div",{class:"mono", style:"font-size:11px;color:var(--text-muted);margin-bottom:12px;"}, `Woche ${r.weekId} · angefragt am ${new Date(r.createdAt).toLocaleDateString("de-DE")}`));

    if(r.status === "pending"){
      const actions = el("div",{style:"display:flex;gap:10px;"});
      const approveBtn = el("button",{class:"btn btn-primary", style:"width:auto;padding:9px 18px;"}, "Genehmigen");
      const rejectBtn = el("button",{class:"btn-cancel", style:"width:auto;padding:9px 18px;"}, "Ablehnen");
      approveBtn.addEventListener("click", async ()=>{
        const assignPath = `weeks/${r.weekId}/schedule/${r.dayKey}/${r.shiftKey}/${r.assignId}`;
        const snap = await get(ref(db, assignPath));
        if(snap.exists()){
          await update(ref(db, assignPath), {employeeId: r.toEmployeeId});
        }
        await update(ref(db, `swapRequests/${reqId}`), {status:"approved"});
      });
      rejectBtn.addEventListener("click", ()=>{
        update(ref(db, `swapRequests/${reqId}`), {status:"rejected"});
      });
      actions.appendChild(approveBtn);
      actions.appendChild(rejectBtn);
      card.appendChild(actions);
    } else {
      card.appendChild(el("span",{class:`avail-pill ${r.status==="approved"?"yes":"no"}`}, r.status==="approved" ? "Genehmigt" : "Abgelehnt"));
    }
    section.appendChild(card);
  });
  return section;
}

// ---------- employee stats (chef) ----------
function renderStats(){
  const section = el("div",{});
  section.appendChild(el("div",{class:"section-head"},[
    el("div",{},[
      el("h2",{class:"section-title"}, "Statistik"),
      el("p",{class:"section-sub"}, "Geleistete Stunden im Vergleich, gesamter erfasster Zeitraum.")
    ])
  ]));

  const empIds = Object.keys(state.employees).filter(id=> state.employees[id].role !== "chef");
  if(empIds.length === 0){
    section.appendChild(el("div",{class:"empty-state"},[el("div",{class:"big"},"📊"),"Noch keine Mitarbeiter registriert."]));
    return section;
  }

  const totals = empIds.map(id=>{
    const entries = Object.values(state.timeEntries[id] || {});
    const hours = entries.reduce((s,e)=> s+e.hours, 0);
    return {id, name: state.employees[id].name, hours};
  }).sort((a,b)=> b.hours - a.hours);

  const maxHours = Math.max(1, ...totals.map(t=> t.hours));
  const card = el("div",{class:"card"});
  totals.forEach(t=>{
    const pct = Math.max(4, Math.round((t.hours/maxHours)*100));
    card.appendChild(el("div",{class:"bar-row"},[
      el("span",{class:"bar-label"}, t.name),
      el("div",{class:"bar-track"},[
        el("div",{class:"bar-fill", style:`width:${pct}%;`},[
          el("span",{}, `${fmtHours(t.hours)} Std.`)
        ])
      ])
    ]));
  });
  section.appendChild(card);
  return section;
}

// ---------- personnel costs (chef) ----------
function renderCosts(){
  const section = el("div",{});
  section.appendChild(el("div",{class:"section-head"},[
    el("div",{},[
      el("h2",{class:"section-title"}, "Personalkosten"),
      el("p",{class:"section-sub"}, "Berechnet aus erfassten Stunden × Stundenlohn, über alle Mitarbeiter.")
    ])
  ]));

  const empIds = Object.keys(state.employees).filter(id=> state.employees[id].role !== "chef");
  const dailyMap = {}, weeklyMap = {}, monthlyMap = {};
  empIds.forEach(id=>{
    const wage = employeeWage(id);
    Object.values(state.timeEntries[id] || {}).forEach(entry=>{
      const cost = entry.hours * wage;
      if(!dailyMap[entry.date]) dailyMap[entry.date] = {hours:0, cost:0};
      dailyMap[entry.date].hours += entry.hours;
      dailyMap[entry.date].cost += cost;

      const wk = isoWeekKeyFromDate(entry.date);
      if(!weeklyMap[wk]) weeklyMap[wk] = {hours:0, cost:0};
      weeklyMap[wk].hours += entry.hours;
      weeklyMap[wk].cost += cost;

      const mk = entry.date.slice(0,7);
      if(!monthlyMap[mk]) monthlyMap[mk] = {hours:0, cost:0};
      monthlyMap[mk].hours += entry.hours;
      monthlyMap[mk].cost += cost;
    });
  });

  if(Object.keys(dailyMap).length === 0){
    section.appendChild(el("div",{class:"empty-state"},[el("div",{class:"big"},"💶"),"Noch keine erfassten Arbeitszeiten."]));
    return section;
  }

  function buildGroup(map, sortDesc, labelFn, defaultOpenKey){
    const details = el("details",{class:"cost-group"});
    const keys = Object.keys(map).sort((a,b)=> sortDesc ? b.localeCompare(a) : a.localeCompare(b));
    if(keys.includes(defaultOpenKey)) details.open = true;
    const arrow = el("span",{style:"color:var(--mango);margin-right:8px;font-size:11px;"}, details.open ? "▾" : "▸");
    details.addEventListener("toggle", ()=>{ arrow.textContent = details.open ? "▾" : "▸"; });
    details.appendChild(el("summary",{},[
      el("div",{style:"display:flex;align-items:center;"},[arrow, el("span",{}, "Alle anzeigen")]),
      el("span",{class:"mono", style:"font-size:12px;color:var(--mango);font-weight:700;"}, fmtMoney(keys.reduce((s,k)=> s+map[k].cost,0)))
    ]));
    const list = el("div",{style:"padding:6px 0;"});
    keys.forEach(k=>{
      list.appendChild(el("div",{class:"cost-row"},[
        el("span",{}, labelFn(k)),
        el("div",{style:"display:flex;gap:14px;"},[
          el("span",{class:"mono", style:"color:var(--text-muted);"}, `${fmtHours(map[k].hours)} Std.`),
          el("span",{class:"mono", style:"color:var(--mango);font-weight:700;"}, fmtMoney(map[k].cost))
        ])
      ]));
    });
    details.appendChild(list);
    return details;
  }

  const todayKey = new Date().toISOString().slice(0,10);
  const currentWeekKey = isoWeekKeyFromDate(todayKey);
  const currentMonthKey = todayKey.slice(0,7);

  const dayCard = el("div",{class:"card"});
  dayCard.appendChild(el("h3",{style:"margin:0 0 8px;font-size:15px;"}, "Nach Tag"));
  dayCard.appendChild(buildGroup(dailyMap, true, (k)=> new Date(k).toLocaleDateString("de-DE",{weekday:"short", day:"2-digit", month:"2-digit", year:"numeric"}), todayKey));
  section.appendChild(dayCard);

  const weekCard = el("div",{class:"card"});
  weekCard.appendChild(el("h3",{style:"margin:0 0 8px;font-size:15px;"}, "Nach Woche"));
  weekCard.appendChild(buildGroup(weeklyMap, true, (k)=> k, currentWeekKey));
  section.appendChild(weekCard);

  const monthCard = el("div",{class:"card"});
  monthCard.appendChild(el("h3",{style:"margin:0 0 8px;font-size:15px;"}, "Nach Monat"));
  monthCard.appendChild(buildGroup(monthlyMap, true, (k)=> monthLabel(k), currentMonthKey));
  section.appendChild(monthCard);

  return section;
}

// ---------- announcements banner (all users) ----------
function renderAnnouncementsBanner(){
  const items = Object.entries(state.announcements || {}).sort((a,b)=> b[1].createdAt - a[1].createdAt).slice(0,3);
  if(items.length === 0) return null;
  const banner = el("div",{class:"announce-banner"});
  banner.appendChild(el("div",{style:"font-size:11px;font-weight:700;color:var(--mango);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px;"}, "📣 Ankündigungen"));
  items.forEach(([id, a])=>{
    const dt = new Date(a.createdAt);
    banner.appendChild(el("div",{class:"announce-item"},[
      el("span",{class:"announce-text"}, a.text),
      el("span",{class:"announce-date"}, dt.toLocaleDateString("de-DE"))
    ]));
  });
  return banner;
}

render();
</script>
