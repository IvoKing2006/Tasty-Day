    const name = nameInput.value.trim();
    let category = catSelect.value === "__new__" ? newCatInput.value.trim() : catSelect.value;
    if(!category) category = "Sonstiges";
    if(!name) return;
    const soll = parseFloat(sollInput.value) || 0;
    const record = {name, category, unit: unitInput.value.trim() || "Stück", soll, ist: soll, area: areaSelect.value, inventoryTracked: !!inventurCheckbox.checked};
    const packSize = parseFloat(packSizeInput.value);
    if(packSize > 0) record.packSize = packSize;
    if(soll > 0){
      record.batches = {};
      const bKey = push(ref(db, "inventory/tmp/batches")).key;
      record.batches[bKey] = {qty: soll, expiry: initExpiryInput.value || null, addedAt: Date.now()};
    }
    const price = parseFloat(priceInput.value);
    if(price > 0){
      const vatRate = parseFloat(vatSelect.value);
      const {netto, brutto} = calcNettoBrutto(price, priceTypeSelect.value, vatRate);
      record.price = netto;
      record.priceBrutto = brutto;
      record.vatRate = vatRate;
    }
    if(supplierInput.value.trim()) record.supplier = supplierInput.value.trim();
    if(shelfInput.value.trim()) record.shelf = shelfInput.value.trim();
    const deposit = parseFloat(depositInput.value);
    if(deposit > 0) record.deposit = deposit;
    const newRef = push(ref(db, "inventory"));
    await set(newRef, record);
    nameInput.value = ""; unitInput.value = ""; sollInput.value = ""; newCatInput.value = "";
    packSizeInput.value = ""; priceInput.value = ""; supplierInput.value = ""; shelfInput.value = ""; initExpiryInput.value = ""; depositInput.value = "";
  });
  addCard.appendChild(el("div",{class:"time-form"},[
    el("div",{},[el("label",{style:"display:block;font-size:12.5px;color:var(--text-muted);margin-bottom:5px;"},"Name"), nameInput]),
    el("div",{},[el("label",{style:"display:block;font-size:12.5px;color:var(--text-muted);margin-bottom:5px;"},"Einheit"), unitInput]),
    el("div",{},[el("label",{style:"display:block;font-size:12.5px;color:var(--text-muted);margin-bottom:5px;"},"Soll-Menge"), sollInput]),
    el("div",{},[el("label",{style:"display:block;font-size:12.5px;color:var(--text-muted);margin-bottom:5px;"},"Stück pro Packung"), packSizeInput]),
    el("div",{},[el("label",{style:"display:block;font-size:12.5px;color:var(--text-muted);margin-bottom:5px;"},"Preis (€)"), priceInput]),
    el("div",{},[el("label",{style:"display:block;font-size:12.5px;color:var(--text-muted);margin-bottom:5px;"},"Preis-Art"), priceTypeSelect]),
    el("div",{},[el("label",{style:"display:block;font-size:12.5px;color:var(--text-muted);margin-bottom:5px;"},"MwSt-Satz"), vatSelect]),
    el("div",{},[el("label",{style:"display:block;font-size:12.5px;color:var(--text-muted);margin-bottom:5px;"},"Pfand pro Einheit (€, optional)"), depositInput]),
    el("div",{},[el("label",{style:"display:block;font-size:12.5px;color:var(--text-muted);margin-bottom:5px;"},"Lieferant"), supplierInput]),
    el("div",{},[el("label",{style:"display:block;font-size:12.5px;color:var(--text-muted);margin-bottom:5px;"},"Lagerbereich"), areaSelect]),
    el("div",{},[el("label",{style:"display:block;font-size:12.5px;color:var(--text-muted);margin-bottom:5px;"},"Regal / Kühlschrank"), shelfInput]),
    el("div",{},[el("label",{style:"display:block;font-size:12.5px;color:var(--text-muted);margin-bottom:5px;"},"MHD (optional)"), initExpiryInput]),
    inventurField,
    el("div",{},[el("label",{style:"display:block;font-size:12.5px;color:var(--text-muted);margin-bottom:5px;"},"Kategorie"), catSelect]),
    el("div",{},[el("label",{style:"display:block;font-size:12.5px;color:var(--text-muted);margin-bottom:5px;"},"Neue Kategorie"), newCatInput]),
    addBtn
  ]));
  section.appendChild(addCard);

  if(items.length === 0 && archivedItems.length === 0){
    section.appendChild(el("div",{class:"empty-state"},[el("div",{class:"big"},[ic("package")]),"Noch keine Zutaten angelegt."]));
    return section;
  }

  // grouped by category, filtered by search
  const searchVal0 = "";
  const listWrap = el("div",{});
  section.appendChild(listWrap);

  function renderList(filterText){
    listWrap.innerHTML = "";
    const filtered = items.filter(([id,it])=>
      it.name.toLowerCase().includes(filterText.toLowerCase()) &&
      (activeArea === "Alle" || it.area === activeArea)
    );
    if(filtered.length === 0){
      listWrap.appendChild(el("div",{class:"empty-state"},[el("div",{class:"big"},[ic("search")]),"Keine Zutat gefunden."]));
      return;
    }
    const groups = {};
    filtered.forEach(([id, it])=>{
      const cat = it.category || "Sonstiges";
      if(!groups[cat]) groups[cat] = [];
      groups[cat].push([id, it]);
    });

    Object.keys(groups).sort().forEach(cat=>{
      const catItems = groups[cat].sort((a,b)=> a[1].name.localeCompare(b[1].name));
      const criticalCount = catItems.filter(([id,it])=> it.status==="red").length;
      const catValue = catItems.reduce((s,[id,it])=> s + ((it.price||0)*(it.ist||0)), 0);
      const details = el("details",{class:"month-group card", style:"padding:16px 20px;"});
      details.open = true;
      const arrow = el("span",{class:"chev open"},[ic("chevronRight")]);
      details.addEventListener("toggle", ()=>{ arrow.classList.toggle("open", details.open); });
      const summaryRight = [`${catItems.length} Zutaten`];
      if(criticalCount>0) summaryRight.push(`${criticalCount} kritisch`);
      if(catValue>0) summaryRight.push(fmtMoney(catValue));
      details.appendChild(el("summary",{},[
        el("div",{style:"display:flex;align-items:center;"},[arrow, el("span",{}, cat)]),
        el("span",{class:"mono", style:`font-size:13px;font-weight:400;color:${criticalCount>0?"var(--chili)":"var(--text-muted)"};`}, summaryRight.join(" · "))
      ]));
      const list = el("div",{style:"padding:10px 0 2px;"});
      catItems.forEach(([id, it])=>{
        const row = el("div",{class:"stock-row", style:"flex-wrap:wrap;"});
        row.appendChild(el("span",{class:`stock-dot ${it.status}`}));
        const nameCol = el("div",{style:"flex:1;min-width:100px;"});
        nameCol.appendChild(el("div",{class:"stock-name"}, it.name));
        const subBits = [];
        if(it.area) subBits.push(it.shelf ? `${it.area} · ${it.shelf}` : it.area);
        if(it.supplier) subBits.push(it.supplier);
        if(it.price) subBits.push(`Netto ${fmtMoney(it.price)} · Brutto ${fmtMoney(it.priceBrutto||it.price)}/${it.unit||"Stk"}`);
        if(it.deposit) subBits.push(`Pfand ${fmtMoney(it.deposit)}`);
        if(subBits.length) nameCol.appendChild(el("div",{style:"font-size:11.5px;color:var(--text-muted);"}, subBits.join(" · ")));
        row.appendChild(nameCol);

        const minusBtn = el("button",{class:"stock-adjust"}, "−");
        const istInput = el("input",{type:"number", step:"0.1", value: it.ist||0, class:"stock-ist-input mono"});
        const plusBtn = el("button",{class:"stock-adjust"}, "+");
        const sollLabel = el("span",{class:"mono", style:"font-size:13px;color:var(--text-muted);white-space:nowrap;"}, `/ ${fmtNum(it.soll||0)} ${it.unit||""}`);

        function saveIst(newVal, prevVal){
          const v = Math.max(0, newVal);
          update(ref(db, `inventory/${id}`), {ist: v});
          logInventoryConsumption(id, prevVal, v);
        }
        minusBtn.addEventListener("click", ()=>{
          const cur = parseFloat(istInput.value)||0;
          istInput.value = Math.max(0, cur-1);
          saveIst(cur-1, cur);
        });
        plusBtn.addEventListener("click", ()=>{
          const cur = parseFloat(istInput.value)||0;
          istInput.value = cur+1;
          saveIst(cur+1, cur);
        });
        istInput.addEventListener("change", ()=>{
          const prevVal = it.ist||0;
          saveIst(parseFloat(istInput.value)||0, prevVal);
        });

        const istGroup = el("div",{style:"display:flex;align-items:center;gap:6px;flex-wrap:wrap;"},[minusBtn, istInput, plusBtn, sollLabel]);
        row.appendChild(istGroup);

        if(it.packSize > 0){
          const packBtn = el("button",{class:"btn-cancel", style:"width:auto;padding:6px 12px;font-size:12.5px;border-radius:20px;white-space:nowrap;"}, `+1 Pack (${fmtNum(it.packSize)})`);
          packBtn.addEventListener("click", ()=>{
            const cur = parseFloat(istInput.value)||0;
            const newVal = cur + it.packSize;
            istInput.value = newVal;
            saveIst(newVal, cur);
          });
          row.appendChild(packBtn);
        }

        const editBtn = el("button",{class:"link-btn", style:"font-size:12.5px;"}, icl("pencil","Bearbeiten"));
        row.appendChild(editBtn);

        const logEntries = Object.values(state.inventoryLog[id] || {});
        const consumeBtn = el("button",{class:"link-btn", style:"font-size:12.5px;"}, icl("chart","Verbrauch"));
        row.appendChild(consumeBtn);

        const batchEntries = Object.entries(it.batches || {}).filter(([bid,b])=> b.qty > 0);
        let mhdBox = null;
        if(batchEntries.length > 0){
          const mhdBtn = el("button",{class:"link-btn", style:"font-size:12.5px;color:var(--mango);"}, icl("calendar","MHD"));
          row.appendChild(mhdBtn);
          mhdBox = el("div",{style:"display:none;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:-2px 0 8px;"});
          let mhdOpen = false;
          mhdBtn.addEventListener("click", ()=>{
            mhdOpen = !mhdOpen;
            if(mhdOpen){
              mhdBox.innerHTML = "";
              batchEntries.sort((a,b)=> (a[1].expiry||"9999").localeCompare(b[1].expiry||"9999")).forEach(([bid, b])=>{
                const days = b.expiry ? daysUntil(b.expiry) : null;
                const color = days===null ? "var(--text-muted)" : days<0 ? "var(--chili)" : days<=EXPIRY_WARN_DAYS ? "var(--mango)" : "var(--avocado)";
                const label = b.expiry ? `MHD ${localDateFromKey(b.expiry).toLocaleDateString("de-DE")} (${days<0?"abgelaufen":days+" Tg."})` : "kein Datum hinterlegt";
                mhdBox.appendChild(el("div",{style:"display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-bottom:1px solid var(--line);"},[
                  el("span",{}, `${fmtNum(b.qty)} ${it.unit||""}`),
                  el("span",{style:`color:${color};font-weight:700;`}, label)
                ]));
              });
            }
            mhdBox.style.display = mhdOpen ? "block" : "none";
          });
        }

        const archiveBtn = el("button",{class:"link-btn", style:"font-size:12.5px;color:var(--text-muted);"}, icl("archive","Archivieren"));
        archiveBtn.addEventListener("click", ()=>{
          if(confirm(`"${it.name}" archivieren? Sie verschwindet aus der aktiven Liste, bleibt aber inkl. Verbrauchshistorie erhalten und kann jederzeit reaktiviert werden.`)){
            update(ref(db, `inventory/${id}`), {archived:true});
          }
        });
        row.appendChild(archiveBtn);
        list.appendChild(row);
        if(mhdBox) list.appendChild(mhdBox);

        const chartBox = el("div",{style:"display:none;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:-2px 0 8px;"});
        let chartOpen = false;
        if(consumeBtn) consumeBtn.addEventListener("click", ()=>{
          chartOpen = !chartOpen;
          if(chartOpen){
            chartBox.innerHTML = "";
            const weekdayLabels = ["Mo","Di","Mi","Do","Fr","Sa","So"];
            const sums = [0,0,0,0,0,0,0];
            logEntries.forEach(le=>{
              const d = localDateFromKey(le.date);
              const idx = (d.getDay()+6)%7;
              sums[idx] += le.amount;
            });
            const max = Math.max(1, ...sums);
            if(logEntries.length === 0){
              chartBox.appendChild(el("div",{style:"font-size:13px;color:var(--text-muted);"}, "Noch keine Verbrauchsdaten — wird automatisch erfasst, sobald die Ist-Menge verringert wird."));
            } else {
              const maxIdx = sums.indexOf(Math.max(...sums));
              chartBox.appendChild(el("div",{style:"font-size:12.5px;color:var(--text-muted);margin-bottom:10px;"}, `Verbraucht meist am ${weekdayLabels[maxIdx]}`));
              weekdayLabels.forEach((wl,i)=>{
                const pct = sums[i]>0 ? Math.max(4, Math.round((sums[i]/max)*100)) : 0;
                chartBox.appendChild(el("div",{style:"display:flex;align-items:center;gap:8px;margin-bottom:5px;"},[
                  el("span",{style:"width:22px;font-size:12.5px;color:var(--text-muted);flex-shrink:0;"}, wl),
                  el("div",{class:"bar-track", style:"height:16px;"},[
                    sums[i]>0 ? el("div",{class:"bar-fill", style:`width:${pct}%;height:100%;`},[
                      el("span",{style:"font-size:11.5px;"}, fmtNum(sums[i]))
                    ]) : null
                  ])
                ]));
              });
              const resetLogBtn = el("button",{class:"link-btn", style:"margin-top:8px;color:var(--chili);font-size:12.5px;"}, icl("refresh","Verbrauchshistorie zurücksetzen"));
              resetLogBtn.addEventListener("click", async ()=>{
                if(!confirm(`Verbrauchshistorie für „${it.name}“ wirklich zurücksetzen? Die Wochentag-Auswertung beginnt danach wieder bei null.`)) return;
                await remove(ref(db, `inventoryLog/${id}`));
                chartBox.innerHTML = "";
                chartBox.appendChild(el("div",{style:"font-size:13px;color:var(--text-muted);"}, "Verbrauchshistorie wurde zurückgesetzt."));
              });
              chartBox.appendChild(resetLogBtn);
            }
          }
          chartBox.style.display = chartOpen ? "block" : "none";
        });
        if(consumeBtn) list.appendChild(chartBox);

        // edit form
        const editBox = el("div",{style:"display:none;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:14px;margin:-2px 0 8px;"});
        let editOpen = false;
        editBtn.addEventListener("click", ()=>{
          editOpen = !editOpen;
          if(editOpen){
            editBox.innerHTML = "";
            const eName = el("input",{type:"text", value:it.name, class:"select-emp", style:"width:100%;"});
            const ePrice = el("input",{type:"number", step:"0.01", min:"0", value:it.price||"", placeholder:"optional", class:"select-emp", style:"width:100%;"});
            const ePriceType = el("select",{class:"select-emp", style:"width:100%;"},[
              el("option",{value:"netto"}, "eingegeben als Netto"),
              el("option",{value:"brutto"}, "eingegeben als Brutto"),
            ]);
            const eVat = el("select",{class:"select-emp", style:"width:100%;"},[
              el("option",{value:"7"}, "7 % (Lebensmittel)"),
              el("option",{value:"19"}, "19 % (Getränke, Verpackung etc.)"),
            ]);
            eVat.value = String(it.vatRate || 7);
            const eSupplier = el("input",{type:"text", value:it.supplier||"", placeholder:"optional", class:"select-emp", style:"width:100%;"});
            const eArea = el("select",{class:"select-emp", style:"width:100%;"});
            STORAGE_AREAS.forEach(a=> eArea.appendChild(el("option",{value:a}, a)));
            eArea.value = it.area || STORAGE_AREAS[0];
            const eShelf = el("input",{type:"text", value:it.shelf||"", placeholder:"z. B. Regal 3 (optional)", class:"select-emp", style:"width:100%;"});
            const eCat = el("input",{type:"text", value:it.category||"", class:"select-emp", style:"width:100%;"});
            const saveBtn = el("button",{class:"btn btn-primary", style:"padding:10px;"}, "Speichern");
            const fields = [
              el("div",{},[el("label",{style:"display:block;font-size:12.5px;color:var(--text-muted);margin-bottom:5px;"},"Name"), eName]),
            ];

            const eUnit = el("input",{type:"text", value:it.unit||"", class:"select-emp", style:"width:100%;"});
            const eSoll = el("input",{type:"number", step:"0.1", min:"0", value:it.soll||0, class:"select-emp", style:"width:100%;"});
            const ePack = el("input",{type:"number", step:"1", min:"0", value:it.packSize||"", placeholder:"leer = keine Packs", class:"select-emp", style:"width:100%;"});
            fields.push(el("div",{},[el("label",{style:"display:block;font-size:12.5px;color:var(--text-muted);margin-bottom:5px;"},"Einheit"), eUnit]));
            fields.push(el("div",{},[el("label",{style:"display:block;font-size:12.5px;color:var(--text-muted);margin-bottom:5px;"},"Soll-Menge"), eSoll]));
            fields.push(el("div",{},[el("label",{style:"display:block;font-size:12.5px;color:var(--text-muted);margin-bottom:5px;"},"Stück pro Packung"), ePack]));
            fields.push(el("div",{},[el("label",{style:"display:block;font-size:12.5px;color:var(--text-muted);margin-bottom:5px;"},"Preis"), ePrice]));
            fields.push(el("div",{},[el("label",{style:"display:block;font-size:12.5px;color:var(--text-muted);margin-bottom:5px;"},"Preis-Art"), ePriceType]));
            fields.push(el("div",{},[el("label",{style:"display:block;font-size:12.5px;color:var(--text-muted);margin-bottom:5px;"},"MwSt-Satz"), eVat]));
            const eDeposit = el("input",{type:"number", step:"0.01", min:"0", value:it.deposit||"", placeholder:"optional", class:"select-emp", style:"width:100%;"});
            fields.push(el("div",{},[el("label",{style:"display:block;font-size:12.5px;color:var(--text-muted);margin-bottom:5px;"},"Pfand pro Einheit (€)"), eDeposit]));
            fields.push(el("div",{},[el("label",{style:"display:block;font-size:12.5px;color:var(--text-muted);margin-bottom:5px;"},"Lieferant"), eSupplier]));
            fields.push(el("div",{},[el("label",{style:"display:block;font-size:12.5px;color:var(--text-muted);margin-bottom:5px;"},"Lagerbereich"), eArea]));
            fields.push(el("div",{},[el("label",{style:"display:block;font-size:12.5px;color:var(--text-muted);margin-bottom:5px;"},"Regal / Kühlschrank"), eShelf]));
            const eInventurCb = el("input",{type:"checkbox", style:"width:16px;height:16px;accent-color:var(--mango);cursor:pointer;"});
            eInventurCb.checked = !!it.inventoryTracked;
            fields.push(el("label",{style:"display:flex;align-items:center;gap:8px;cursor:pointer;padding-top:22px;"},[eInventurCb, el("span",{style:"font-size:13px;color:var(--text-muted);"},"In Inventur aufnehmen")]));
            fields.push(el("div",{},[el("label",{style:"display:block;font-size:12.5px;color:var(--text-muted);margin-bottom:5px;"},"Kategorie"), eCat]));
            saveBtn.addEventListener("click", ()=>{
              const updates = {
                name: eName.value.trim() || it.name,
                unit: eUnit.value.trim() || "Stück",
                soll: parseFloat(eSoll.value) || 0,
                category: eCat.value.trim() || "Sonstiges",
                area: eArea.value,
                inventoryTracked: !!eInventurCb.checked,
              };
              const packVal = parseFloat(ePack.value);
              updates.packSize = packVal > 0 ? packVal : null;
              const priceVal = parseFloat(ePrice.value);
              if(priceVal > 0){
                const vatRate = parseFloat(eVat.value);
                const {netto, brutto} = calcNettoBrutto(priceVal, ePriceType.value, vatRate);
                updates.price = netto;
                updates.priceBrutto = brutto;
                updates.vatRate = vatRate;
              } else {
                updates.price = null;
                updates.priceBrutto = null;
                updates.vatRate = null;
              }
              updates.supplier = eSupplier.value.trim() || null;
              const depositVal = parseFloat(eDeposit.value);
              updates.deposit = depositVal > 0 ? depositVal : null;
              updates.shelf = eShelf.value.trim() || null;
              update(ref(db, `inventory/${id}`), updates);
              editOpen = false;
              editBox.style.display = "none";
            });
            fields.push(saveBtn);
            editBox.appendChild(el("div",{class:"time-form"}, fields));
          }
          editBox.style.display = editOpen ? "block" : "none";
        });
        list.appendChild(editBox);
      });
      details.appendChild(list);
      listWrap.appendChild(details);
    });
  }

  renderList(searchVal0);
  searchInput.addEventListener("input", ()=> renderList(searchInput.value));

  if(archivedItems.length > 0){
    const archDetails = el("details",{class:"month-group card", style:"padding:16px 20px;"});
    const archArrow = el("span",{class:"chev"},[ic("chevronRight")]);
    archDetails.addEventListener("toggle", ()=>{ archArrow.classList.toggle("open", archDetails.open); });
    archDetails.appendChild(el("summary",{},[
      el("div",{style:"display:flex;align-items:center;"},[archArrow, el("span",{}, icl("archive","Archivierte Zutaten"))]),
      el("span",{class:"mono", style:"font-size:13px;color:var(--text-muted);font-weight:400;"}, `${archivedItems.length}`)
    ]));
    const archList = el("div",{style:"padding:10px 0 2px;"});
    archivedItems.sort((a,b)=> a[1].name.localeCompare(b[1].name)).forEach(([id, it])=>{
      const row = el("div",{class:"stock-row"});
      row.appendChild(el("span",{class:"stock-name", style:"opacity:.6;"}, `${it.name} — ${it.category||""}`));
      const restoreBtn = el("button",{class:"link-btn", style:"font-size:12.5px;"}, icl("undo","Reaktivieren"));
      restoreBtn.addEventListener("click", ()=> update(ref(db, `inventory/${id}`), {archived:false}));
      row.appendChild(restoreBtn);
      const deleteForeverBtn = el("button",{class:"del-btn", onclick:()=>{
        if(confirm(`"${it.name}" endgültig löschen? Das kann nicht rückgängig gemacht werden.`)){
          remove(ref(db, `inventory/${id}`));
          remove(ref(db, `inventoryLog/${id}`));
        }
      }},[ic("x")]);
      row.appendChild(deleteForeverBtn);
      archList.appendChild(row);
    });
    archDetails.appendChild(archList);
    section.appendChild(archDetails);
  }

  return section;
}

// ---------- inventory barcode scanner ----------
function openInventoryScanner(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    alert("Kamera-Zugriff wird von diesem Browser nicht unterstützt.");
    return;
  }
  const overlay = el("div",{style:"position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;overflow-y:auto;"});

  const modeRow = el("div",{style:"display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;justify-content:center;"});
  let mode = "out";
  const outBtn = el("button",{class:"tab active", style:"background:var(--chili);color:#fff;"}, "− Entnahme");
  const inBtn = el("button",{class:"tab", style:"background:var(--bg-elevated);color:var(--text-muted);"}, "+ Auffüllen");
  const inventurBtn = el("button",{class:"tab", style:"background:var(--bg-elevated);color:var(--text-muted);"}, icl("clipboard","Inventur"));
  overlay.appendChild(modeRow);
  modeRow.appendChild(outBtn);
  modeRow.appendChild(inBtn);
  modeRow.appendChild(inventurBtn);

  // Inventur progress — persistiert pro Tag, nicht nur pro Sitzung
  const inventurProgress = el("div",{style:"display:none;font-size:13px;margin-bottom:10px;text-align:center;max-width:340px;"});
  function getOpenTrackedItems(){
    const today = toDateKey(new Date());
    return Object.entries(state.inventory||{})
      .filter(([id,it])=> it.inventoryTracked && !it.archived && it.lastInventurDate !== today)
      .map(([id,it])=> ({id, name:it.name}));
  }
  function getDoneTrackedCount(){
    const today = toDateKey(new Date());
    return Object.values(state.inventory||{}).filter(it=> it.inventoryTracked && !it.archived && it.lastInventurDate === today).length;
  }
  function updateInventurProgress(){
    const open = getOpenTrackedItems();
    const doneCount = getDoneTrackedCount();
    const total = open.length + doneCount;
    inventurProgress.innerHTML = "";
    if(total === 0){
      inventurProgress.appendChild(el("div",{style:"color:var(--text-muted);"}, "Keine Zutaten für die Inventur markiert. Bei „Bearbeiten“ eine Zutat dafür auswählen."));
      return;
    }
    if(open.length === 0){
      inventurProgress.appendChild(el("div",{style:"color:var(--avocado);font-weight:700;"}, icl("check", `Heutige Inventur komplett (${total}/${total})`)));
      return;
    }
    inventurProgress.appendChild(el("div",{style:"color:var(--mango);font-weight:700;margin-bottom:6px;"}, `Noch zu scannen (${open.length} von ${total}):`));
    inventurProgress.appendChild(el("div",{style:"display:flex;flex-wrap:wrap;gap:5px;justify-content:center;"},
      open.map(o=> el("span",{style:"background:var(--bg-elevated-2);border:1px solid var(--line);border-radius:12px;padding:3px 9px;font-size:12.5px;"}, o.name))
    ));
  }
  updateInventurProgress();
  overlay.appendChild(inventurProgress);

  // quantity selector — only relevant for Auffüllen
  let qty = 1;
  const qtyRow = el("div",{style:"display:none;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;justify-content:center;"});
  const qtyLabel = el("span",{style:"font-size:13px;color:var(--text-muted);margin-right:4px;"}, "Menge:");
  qtyRow.appendChild(qtyLabel);
  const qtyButtons = [];
  [1,2,3,4,5,6].forEach(n=>{
    const b = el("button",{class:"tab", style:`background:${n===1?"var(--avocado)":"var(--bg-elevated)"};color:${n===1?"var(--avocado-ink)":"var(--text-muted)"};padding:6px 12px;`}, String(n));
    b.addEventListener("click", ()=>{
      qty = n;
      qtyButtons.forEach(bb=>{ bb.style.background="var(--bg-elevated)"; bb.style.color="var(--text-muted)"; });
      b.style.background="var(--avocado)"; b.style.color="var(--avocado-ink)";
    });
    qtyButtons.push(b);
    qtyRow.appendChild(b);
  });
  overlay.appendChild(qtyRow);

  function setMode(m){
    mode = m;
    outBtn.style.background="var(--bg-elevated)"; outBtn.style.color="var(--text-muted)";
    inBtn.style.background="var(--bg-elevated)"; inBtn.style.color="var(--text-muted)";
    inventurBtn.style.background="var(--bg-elevated)"; inventurBtn.style.color="var(--text-muted)";
    qtyRow.style.display = "none";
    inventurProgress.style.display = "none";
    if(m==="out"){ outBtn.style.background="var(--chili)"; outBtn.style.color="#fff"; }
    else if(m==="in"){ inBtn.style.background="var(--avocado)"; inBtn.style.color="var(--avocado-ink)"; qtyRow.style.display="flex"; }
    else { inventurBtn.style.background="var(--mango)"; inventurBtn.style.color="var(--mango-ink)"; inventurProgress.style.display="block"; }
  }
  outBtn.addEventListener("click", ()=> setMode("out"));
  inBtn.addEventListener("click", ()=> setMode("in"));
  inventurBtn.addEventListener("click", ()=> setMode("inventur"));

  const videoWrap = el("div",{style:"width:100%;max-width:340px;aspect-ratio:1;border-radius:16px;overflow:hidden;position:relative;border:2px solid var(--mango);background:#000;"});
  const video = el("video",{playsinline:"true", muted:"true", style:"width:100%;height:100%;object-fit:cover;"});
  videoWrap.appendChild(video);
  const statusText = el("div",{style:"color:var(--text);margin-top:18px;font-size:14px;text-align:center;min-height:20px;"}, "Kamera wird gestartet…");
  const expiryBox = el("div",{style:"display:none;background:var(--bg-elevated);border-radius:12px;padding:16px;margin-top:16px;width:100%;max-width:340px;text-align:center;"});
  const closeBtn = el("button",{class:"btn-cancel", style:"margin-top:22px;width:auto;padding:10px 24px;background:var(--bg-elevated);"}, "Fertig");

  overlay.appendChild(videoWrap);
  overlay.appendChild(statusText);
  overlay.appendChild(expiryBox);
  overlay.appendChild(closeBtn);
  document.body.appendChild(overlay);

  let stream = null;
  let scanning = true;
  let paused = false;
  let lastCode = null, lastTime = 0;
  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");

  function stopAll(){
    scanning = false;
    if(stream) stream.getTracks().forEach(t=> t.stop());
    if(overlay.parentNode) overlay.remove();
  }
  closeBtn.addEventListener("click", stopAll);

  navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}})
    .then(s=>{
      stream = s;
      video.srcObject = s;
      video.play();
      statusText.textContent = "Halte den Etikett-Code vor die Kamera";
      requestAnimationFrame(tick);
    })
    .catch(err=>{
      statusText.textContent = "Kamera-Zugriff nicht möglich: " + err.message;
    });

  function askExpiryThenResume(itemId, itemName, addedQty){
    paused = true;
    expiryBox.style.display = "block";
    expiryBox.innerHTML = "";
    expiryBox.appendChild(el("div",{style:"font-size:14px;color:var(--text-muted);margin-bottom:10px;"}, `MHD für ${addedQty}× ${itemName} (optional)`));
    const dateInput = el("input",{type:"date", style:"padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:14px;margin-bottom:12px;width:100%;"});
    expiryBox.appendChild(dateInput);
    const btnRow = el("div",{style:"display:flex;gap:10px;"});
    const saveDateBtn = el("button",{class:"btn btn-primary", style:"padding:9px;"}, "Speichern");
    const skipBtn = el("button",{class:"btn-cancel", style:"padding:9px;"}, "Überspringen");
    saveDateBtn.addEventListener("click", async ()=>{
      const batchRef = push(ref(db, `inventory/${itemId}/batches`));
      await set(batchRef, {qty: addedQty, expiry: dateInput.value || null, addedAt: Date.now()});
      resumeScanning();
    });
    skipBtn.addEventListener("click", async ()=>{
      const batchRef = push(ref(db, `inventory/${itemId}/batches`));
      await set(batchRef, {qty: addedQty, expiry: null, addedAt: Date.now()});
      resumeScanning();
    });
    btnRow.appendChild(saveDateBtn);
    btnRow.appendChild(skipBtn);
    expiryBox.appendChild(btnRow);
  }

  function resumeScanning(){
    expiryBox.style.display = "none";
    paused = false;
    statusText.textContent = mode==="inventur" ? "Nächste Zutat scannen…" : "Halte den nächsten Code vor die Kamera";
    requestAnimationFrame(tick);
  }

  function askInventurFractionThenResume(itemId, item){
    paused = true;
    expiryBox.style.display = "block";
    expiryBox.innerHTML = "";
    const wholeUnits = Math.floor(item.ist||0);
    expiryBox.appendChild(el("div",{style:"font-size:14px;color:var(--text-muted);margin-bottom:4px;"}, `${item.name}`));
    expiryBox.appendChild(el("div",{style:"font-size:13px;color:var(--text-muted);margin-bottom:10px;"}, `${wholeUnits} volle ${item.unit||"Stk"} sind erfasst. Wie viel ist von der angebrochenen Einheit noch übrig?`));
    const btnRow = el("div",{style:"display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:8px;"});
    [
      {label:"0", val:0},
      {label:"¼", val:0.25},
      {label:"½", val:0.5},
      {label:"¾", val:0.75},
      {label:"1 (voll)", val:1},
    ].forEach(opt=>{
      const b = el("button",{class:"btn-primary", style:"padding:10px 14px;border-radius:9px;border:none;font-weight:700;flex:1;min-width:60px;"}, opt.label);
      b.addEventListener("click", async ()=>{
        const newIst = wholeUnits + opt.val;
        await update(ref(db, `inventory/${itemId}`), {ist: newIst, lastInventurDate: toDateKey(new Date())});
        updateInventurProgress();
        statusText.innerHTML = "";
        statusText.appendChild(el("div",{style:"color:var(--mango);font-weight:700;"}, icl("check", `${item.name}: ${fmtNum(newIst)} ${item.unit||""} erfasst`)));
        resumeScanning();
      });
      btnRow.appendChild(b);
    });
    expiryBox.appendChild(btnRow);
    const skipBtn = el("button",{class:"btn-cancel", style:"padding:9px;width:100%;"}, "Überspringen");
    skipBtn.addEventListener("click", ()=> resumeScanning());
    expiryBox.appendChild(skipBtn);
  }

  function tick(){
    if(!scanning || paused) return;
    if(video.readyState === video.HAVE_ENOUGH_DATA){
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageData = ctx.getImageData(0,0,canvas.width,canvas.height);
      const code = window.jsQR ? window.jsQR(imageData.data, imageData.width, imageData.height) : null;
      const now = Date.now();
      if(code && code.data && code.data.startsWith(INV_CODE_PREFIX) && !(code.data===lastCode && now-lastTime<1800)){
        lastCode = code.data; lastTime = now;
        const itemId = code.data.slice(INV_CODE_PREFIX.length);
        const item = state.inventory[itemId];
        if(item){
          if(mode === "inventur"){
            if(!item.inventoryTracked){
              statusText.innerHTML = "";
              statusText.appendChild(el("div",{style:"color:var(--text-muted);"}, `${item.name} ist nicht Teil der Inventur.`));
              return;
            }
            askInventurFractionThenResume(itemId, item);
            return;
          } else if(mode === "in"){
            bumpIst(itemId, qty).then(()=>{
              statusText.innerHTML = "";
              statusText.appendChild(el("div",{style:"color:var(--avocado);font-weight:700;"}, icl("check", `${item.name}: +${qty} ${item.unit||""}`)));
              askExpiryThenResume(itemId, item.name, qty);
            });
            return;
          } else {
            consumeInventoryBatches(itemId, 1).then(()=>{
              const newVal = Math.max(0, (item.ist||0)-1);
              statusText.innerHTML = "";
              statusText.appendChild(el("div",{style:"color:var(--chili);font-weight:700;"}, icl("check", `${item.name}: ${fmtNum(newVal)} ${item.unit||""}`)));
            });
          }
        } else {
          statusText.textContent = "Unbekannter Code — Zutat nicht gefunden.";
        }
      }
    }
    requestAnimationFrame(tick);
  }
}

// ---------- printable inventory labels ----------
function openInventoryLabelsOverlay(items){
  document.querySelectorAll(".label-overlay-instance").forEach(el=> el.remove());
  const overlay = el("div",{class:"label-overlay-instance", style:"position:fixed;inset:0;background:var(--bg);z-index:100;overflow-y:auto;padding:24px;"});
  const bar = el("div",{class:"no-print", style:"display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:10px;"},[
    el("h2",{class:"section-title"}, "Etiketten zum Ausdrucken"),
    el("div",{style:"display:flex;gap:10px;"},[
      el("button",{class:"btn btn-primary", style:"width:auto;padding:10px 20px;", onclick:()=> doPrint()}, icl("printer","Drucken")),
      el("button",{class:"btn-cancel", style:"width:auto;padding:10px 20px;", onclick:()=> overlay.remove()}, "Schließen"),
    ])
  ]);
  overlay.appendChild(bar);

  const selectRow = el("div",{class:"no-print", style:"display:flex;gap:16px;margin-bottom:16px;flex-wrap:wrap;"});
  const selectAllBtn = el("button",{class:"link-btn"}, "Alle auswählen");
  const selectNewBtn = el("button",{class:"link-btn"}, "Nur neue (noch nie gedruckt)");
  const selectNoneBtn = el("button",{class:"link-btn"}, "Keine auswählen");
  const resetPrintedBtn = el("button",{class:"link-btn", style:"color:var(--chili);"}, icl("refresh","Druck-Status zurücksetzen"));
  resetPrintedBtn.addEventListener("click", async ()=>{
    if(!confirm("Alle Zutaten wieder als „neu / noch nie gedruckt“ markieren?")) return;
    const updates = {};
    items.forEach(([id])=>{ updates[`inventory/${id}/labelPrinted`] = null; });
    await update(ref(db), updates);
    checkboxes.forEach(cb=>{ cb.checked = true; cb.dispatchEvent(new Event("change")); });
    alert("Druck-Status zurückgesetzt — alle Zutaten gelten wieder als neu.");
  });
  selectRow.appendChild(selectAllBtn);
  selectRow.appendChild(selectNewBtn);
  selectRow.appendChild(selectNoneBtn);
  selectRow.appendChild(resetPrintedBtn);
  overlay.appendChild(selectRow);

  const checkboxes = [];
  const grid = el("div",{class:"print-area"});
  items.forEach(([id, it])=>{
    const wrap = el("div",{style:"display:flex;flex-direction:column;align-items:center;gap:6px;"});
    const checkLabel = el("label",{class:"no-print", style:"display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--text-muted);cursor:pointer;"});
    const checkbox = el("input",{type:"checkbox", style:"width:14px;height:14px;accent-color:var(--mango);cursor:pointer;"});
    checkbox.checked = !it.labelPrinted;
    checkbox.dataset.itemId = id;
    checkboxes.push(checkbox);
    checkLabel.appendChild(checkbox);
    checkLabel.appendChild(document.createTextNode(it.labelPrinted ? "bereits gedruckt" : "neu"));
    wrap.appendChild(checkLabel);

    const card = el("div",{class:"label-card"});
    const qrBox = el("div",{});
    card.appendChild(qrBox);
    card.appendChild(el("div",{class:"lbl-name"}, it.name));
    wrap.appendChild(card);
    checkbox.addEventListener("change", ()=>{ card.style.display = checkbox.checked ? "flex" : "none"; });
    card.style.display = checkbox.checked ? "flex" : "none";

    grid.appendChild(wrap);
    setTimeout(()=>{
      if(window.QRCode) new window.QRCode(qrBox, {text: INV_CODE_PREFIX+id, width:110, height:110, colorDark:"#000000", colorLight:"#ffffff"});
    }, 0);
  });
  overlay.appendChild(grid);
  document.body.appendChild(overlay);

  selectAllBtn.addEventListener("click", ()=> checkboxes.forEach(cb=>{ cb.checked=true; cb.dispatchEvent(new Event("change")); }));
  selectNoneBtn.addEventListener("click", ()=> checkboxes.forEach(cb=>{ cb.checked=false; cb.dispatchEvent(new Event("change")); }));
  selectNewBtn.addEventListener("click", ()=> checkboxes.forEach(cb=>{
    const it = state.inventory[cb.dataset.itemId];
    cb.checked = it ? !it.labelPrinted : true;
    cb.dispatchEvent(new Event("change"));
  }));

  function doPrint(){
    const checkedIds = checkboxes.filter(cb=> cb.checked).map(cb=> cb.dataset.itemId);
    if(checkedIds.length === 0){ alert("Bitte mindestens eine Zutat auswählen."); return; }
    checkedIds.forEach(id=> update(ref(db, `inventory/${id}`), {labelPrinted:true}));
    window.print();
  }
}

function fmtNum(v){
  return Number(v).toLocaleString("de-DE",{maximumFractionDigits:2});
}

function renderAnnouncementsBanner(){
  const nowTs = Date.now();
  const items = Object.entries(state.announcements || {}).filter(([id,a])=> !a.expiresAt || a.expiresAt > nowTs).sort((a,b)=> b[1].createdAt - a[1].createdAt).slice(0,3);
  if(items.length === 0) return null;
  const banner = el("div",{class:"announce-banner"});
  banner.appendChild(el("div",{class:"announce-head"},[ el("span",{class:"ic-wrap"},[ic("megaphone")]), "Ankündigungen" ]));
  items.forEach(([id, a])=>{
    const dt = new Date(a.createdAt);
    banner.appendChild(el("div",{class:"announce-item"},[
      el("span",{class:"announce-text"}, a.text),
      el("span",{class:"announce-date"}, dt.toLocaleDateString("de-DE",{day:"numeric", month:"short"}))
    ]));
  });
  return banner;
}

render();
</script>
</body>
</html>
